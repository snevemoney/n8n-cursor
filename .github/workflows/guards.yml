name: Global Guards
on: [pull_request]

jobs:
  no-env-in-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...)
          if printf '%s\n' "$CHANGED" | grep -Eq '\.env(\.|$)'; then
            echo "❌ Env files must not change in PRs"
            exit 1
          fi

  api-contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          API_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}... -- apps/api)
          CONTRACT_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}... -- contracts/openapi.yaml)
          A=$(printf '%s\n' "$API_CHANGED" | grep -c . || true)
          C=$(printf '%s\n' "$CONTRACT_CHANGED" | grep -c . || true)
          if [ $A -gt 0 ] && [ $C -eq 0 ]; then
            echo "❌ API changed without openapi.yaml update"
            exit 1
          fi

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  no-cross-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...)
          L=$(printf '%s\n' "$CHANGED" | grep -E '^apps/lfai/|^workflows/lfai/' || true)
          S=$(printf '%s\n' "$CHANGED" | grep -E '^apps/side/|^workflows/side/' || true)
          if [ -n "$L" ] && [ -n "$S" ]; then
            echo "❌ PR touches LFAI & SIDE. Split PRs."
            exit 1
          fi
