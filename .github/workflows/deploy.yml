name: Deploy

on:
  push:
    branches: [ "04-staging", "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    # Map branch -> environment
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Pick environment (staging/main)
        id: pick
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.PROJECT_PATH }}"
            git fetch --all --prune
            if [[ "${{ steps.pick.outputs.env }}" == "production" ]]; then
              git checkout main && git pull origin main
            else
              git checkout 04-staging && git pull origin 04-staging
            fi

            # Pre-flight health & structure checks
            make guard || true
            make wf-validate || true
            make doctor || true

            # Bring up stack safely
            DRY_RUN=0 make up

            # Health check (fail pipeline if unhealthy)
            curl -fsS -m 10 "${{ secrets.HEALTH_URL }}"
