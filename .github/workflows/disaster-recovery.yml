name: Disaster Recovery Monitor
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Check health
        run: |
          set -e
          URL="${{ secrets.HEALTH_URL }}"
          echo "Checking ${URL}"
          curl -fsS -m 10 "$URL"
          
      - name: Log health status
        run: |
          echo "✅ Health check passed at $(date -u)"
          echo "URL: ${{ secrets.HEALTH_URL }}"
          echo "Timestamp: $(date -u +%FT%TZ)"
