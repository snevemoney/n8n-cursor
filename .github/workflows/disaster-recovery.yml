name: Disaster Recovery Monitor
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}

jobs:
  health-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check health (staging)
        run: curl -fsS -m 10 "${{ secrets.HEALTH_URL }}"
      
      - name: Open incident issue (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Health check failed – ${context.job}`,
              body: `**Health Check Failure Detected**
            
            **Environment**: Staging
            **Endpoint**: ${{ secrets.HEALTH_URL }}
            **Workflow**: ${context.workflow} / ${context.runId}
            **Time**: ${new Date().toISOString()}
            
            **Immediate Actions**:
            1. SSH to server: \`ssh -p 22222 evens@69.62.66.78\`
            2. Check services: \`make status\`
            3. Run diagnostics: \`make doctor\`
            4. Check logs: \`make logs\`
            
            **Recovery Commands**:
            \`\`\`bash
            cd /home/evens/n8n-cursor
            make doctor          # Check system health
            DRY_RUN=0 make up   # Restart services
            curl -f https://n8ncloud.tech/healthz  # Verify recovery
            \`\`\``,
              labels: ['incident', 'health-check', 'staging']
            });
            console.log(\`Created issue: \${issue.data.html_url}\`);

  health-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check health (production)
        run: curl -fsS -m 10 "${{ secrets.HEALTH_URL }}"
      
      - name: Open incident issue (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: \`🚨 PRODUCTION HEALTH CHECK FAILED – \${context.job}\`,
              body: \`**🚨 PRODUCTION HEALTH CHECK FAILURE**
            
            **Environment**: Production
            **Endpoint**: ${{ secrets.HEALTH_URL }}
            **Workflow**: \${context.workflow} / \${context.runId}
            **Time**: \${new Date().toISOString()}
            
            **URGENT - Production Down**
            
            **Immediate Actions**:
            1. SSH to server: \`ssh -p 22222 evens@69.62.66.78\`
            2. Check services: \`make status\`
            3. Run diagnostics: \`make doctor\`
            4. Check logs: \`make logs\`
            
            **Emergency Recovery**:
            \`\`\`bash
            cd /home/evens/n8n-cursor
            
            # Quick health check
            make doctor
            
            # Restart services
            DRY_RUN=0 make up
            
            # Verify recovery
            curl -f https://n8ncloud.tech/healthz
            
            # If still failing, rollback
            git reset --hard HEAD~1
            DRY_RUN=0 make up
            \`\`\`
            
            **Escalation**: If not resolved in 15 minutes, consider manual intervention.\`,
              labels: ['incident', 'health-check', 'production', 'urgent']
            });
            console.log(\`Created issue: \${issue.data.html_url}\`);
