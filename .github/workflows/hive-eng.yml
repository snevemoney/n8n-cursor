name: Hive engineering gates

on:
  pull_request:

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Control-plane tests
        run: python3 -m unittest scripts.hive.eng.test_hive_job scripts.hive.eng.test_hive_matrix scripts.hive.eng.test_hive_gate scripts.hive.eng.test_hive_rules scripts.hive.eng.test_signal scripts.hive.eng.test_delivery -q
      - name: Secret scan of the git index
        run: python3 scripts/hive/eng/secret-scan.py
