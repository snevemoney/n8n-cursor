# Mirrors GitHub Actions failure alerts to Gmail for Grok agent triage.
# Native GitHub emails still follow account settings (github.com/settings/notifications).
#
# Required repo secrets (reuse council SMTP if present):
#   SMTP_USER or N8N_SMTP_USER — Gmail address (e.g. snevemoney12@gmail.com)
#   SMTP_PASSWORD or N8N_SMTP_PASS — Gmail app password
# Optional:
#   CI_FAILURE_NOTIFY_EMAIL — defaults to snevemoney12@gmail.com
#   SMTP_HOST / SMTP_PORT / SMTP_FROM — same as council-consolidated-reports.yml

name: CI Failure Notify Gmail
# 2026-10-11 Forge draft: fix 'A mapping was not expected' (Build alert body) and deliver via ntfy; Gmail step kept but disabled.

on:
  workflow_run:
    workflows:
      - Reliability Guards
      - Security Scan
      - Scope Validation & Quality Gates
      - Global Consistency Contract Enforcement
      - LightningFlow AI CI/CD Pipeline
      - Global Guards
      - Scorpion CI - Tests & Security
      - CI - Integration
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow_name:
        description: Workflow name for test alert
        required: false
        default: Manual SMTP test
      run_url:
        description: Link included in test body
        required: false
        default: https://github.com/snevemoney/n8n-cursor/actions

permissions:
  actions: read
  contents: read

jobs:
  notify-gmail:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Detect SMTP secrets
        id: smtp
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          N8N_SMTP_USER: ${{ secrets.N8N_SMTP_USER }}
        run: |
          if [ -n "$SMTP_USER" ] || [ -n "$N8N_SMTP_USER" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build alert body
        id: body
        env:
          RUN: ${{ toJSON(github.event.workflow_run) }}
          DISPATCH_NAME: ${{ github.event.inputs.workflow_name }}
          DISPATCH_URL: ${{ github.event.inputs.run_url }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="$DISPATCH_NAME"
            BRANCH="${{ github.ref_name }}"
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            URL="$DISPATCH_URL"
            ACTOR="${{ github.actor }}"
            MSG="Manual SMTP connectivity test"
          else
            NAME=$(echo "$RUN" | jq -r '.name')
            BRANCH=$(echo "$RUN" | jq -r '.head_branch')
            SHA=$(echo "$RUN" | jq -r '.head_sha' | cut -c1-7)
            URL=$(echo "$RUN" | jq -r '.html_url')
            ACTOR=$(echo "$RUN" | jq -r '.actor.login')
            MSG=$(echo "$RUN" | jq -r '.display_title // .head_commit.message // "—"' | head -1)
          fi
          {
            echo "content<<EOF"
            echo "[${{ github.repository }}] CI failed"
            echo ""
            echo "Workflow: $NAME"
            echo "Branch:   $BRANCH"
            echo "Commit:   $SHA — $MSG"
            echo "Actor:    $ACTOR"
            echo ""
            echo "View run: $URL"
            echo ""
            echo "— Grok Communications Manager / Forge triage (github-ci-failure-triage skill)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send ntfy alert
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_ALERTS_TOKEN }}
          BODY: ${{ steps.body.outputs.content }}
          TITLE: "CI failed: ${{ github.event.inputs.workflow_name || github.event.workflow_run.name }}"
        run: |
          if [ -z "$NTFY_TOKEN" ]; then echo "::error::repo secret NTFY_ALERTS_TOKEN not set"; exit 1; fi
          curl -fsS -m 20 --retry 3 -H "Authorization: Bearer $NTFY_TOKEN" -H "Title: $TITLE" \
            -H "Priority: 4" -H "Tags: rotating_light" --data-binary "$BODY" https://ntfy.evenslouis.ca/evens-alerts

      - name: Send Gmail alert (disabled; ntfy is primary)
        if: false && steps.smtp.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || secrets.N8N_SMTP_HOST || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || secrets.N8N_SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USER || secrets.N8N_SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD || secrets.N8N_SMTP_PASS }}
          subject: '[${{ github.repository }}] CI failed: ${{ github.event.inputs.workflow_name || github.event.workflow_run.name }}'
          to: ${{ secrets.CI_FAILURE_NOTIFY_EMAIL || 'snevemoney12@gmail.com' }}
          from: ${{ secrets.SMTP_FROM || secrets.N8N_SMTP_SENDER || 'Hive CI <snevemoney12@gmail.com>' }}
          body: ${{ steps.body.outputs.content }}
          ignore_cert: true

      - name: SMTP not configured
        if: false && steps.smtp.outputs.configured != 'true'
        run: |
          echo "::warning::CI failure Gmail mirror skipped — set SMTP_USER + SMTP_PASSWORD (Gmail app password) in repo secrets."
          exit 1
