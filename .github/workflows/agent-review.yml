name: Agent PR Review
# Advisory AI review (COMMENT only; never approves or blocks). Approved by Evens 2026-10-13 (P11).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Agent review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "no OPENROUTER_API_KEY secret; skipping"; exit 0; fi
          python3 scripts/review/agent_pr_review.py ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --post
