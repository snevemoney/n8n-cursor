name: LightningFlow AI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [local, integration, testing, staging, production]

env:
  NODE_VERSION: '20'

jobs:
  # Pre-flight checks
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run structure verification
        run: npm run verify-structure
      
      - name: Run ports check
        run: npm run ports-check
      
      - name: Run secrets scan
        run: npm run scan-secrets

  # Depreciation audit (blocks promotion)
  depreciation-audit:
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run depreciation audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUDIT_ENV: ${{ github.event.inputs.environment }}
        run: node scripts/audit-depreciation.mjs --env=${{ github.event.inputs.environment }}
      
      - name: Check depreciation score
        run: |
          echo "✅ Depreciation audit passed for ${{ github.event.inputs.environment }}"
          echo "🚀 Ready for promotion"

  # Credential sync (ensures target has required creds)
  credential-sync:
    runs-on: ubuntu-latest
    needs: [preflight, depreciation-audit]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Sync credentials to target
        env:
          N8N_TARGET_BASE_URL: ${{ secrets[format('N8N_{0}_BASE_URL', github.event.inputs.environment)] }}
          N8N_TARGET_API_KEY: ${{ secrets[format('N8N_{0}_API_KEY', github.event.inputs.environment)] }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: npm run cred:sync

  # Workflow promotion
  promote-workflows:
    runs-on: ubuntu-latest
    needs: [preflight, depreciation-audit, credential-sync]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Promote workflows to target
        env:
          N8N_SOURCE_BASE_URL: ${{ secrets.N8N_SOURCE_BASE_URL }}
          N8N_SOURCE_API_KEY: ${{ secrets.N8N_SOURCE_API_KEY }}
          N8N_TARGET_BASE_URL: ${{ secrets[format('N8N_{0}_BASE_URL', github.event.inputs.environment)] }}
          N8N_TARGET_API_KEY: ${{ secrets[format('N8N_{0}_API_KEY', github.event.inputs.environment)] }}
        run: |
          npm run promote -- --to ${{ github.event.inputs.environment }} --activate

  # Smoke tests (post-promotion validation)
  smoke-tests:
    runs-on: ubuntu-latest
    needs: [preflight, depreciation-audit, credential-sync, promote-workflows]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run smoke tests
        env:
          N8N_TARGET_BASE_URL: ${{ secrets[format('N8N_{0}_BASE_URL', github.event.inputs.environment)] }}
          N8N_TARGET_API_KEY: ${{ secrets[format('N8N_{0}_API_KEY', github.event.inputs.environment)] }}
        run: npm run smoke

  # Post-promotion notification
  notify-success:
    runs-on: ubuntu-latest
    needs: [preflight, depreciation-audit, credential-sync, promote-workflows, smoke-tests]
    if: github.event_name == 'workflow_dispatch' && always()
    steps:
      - name: Notify promotion success
        if: needs.smoke-tests.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "✅ Workflows successfully promoted to ${{ github.event.inputs.environment }}"
          channel: '#ops-alerts'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Notify promotion failure
        if: needs.smoke-tests.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "❌ Workflow promotion to ${{ github.event.inputs.environment }} failed"
          channel: '#ops-alerts'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
