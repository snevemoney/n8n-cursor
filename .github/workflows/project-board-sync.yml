name: Project Board Sync
on:
  workflow_run:
    workflows: ["Deploy", "Disaster Recovery"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes
  workflow_dispatch: {}

jobs:
  sync-project-board:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests
          
      - name: Get project board ID
        id: get-project-id
        run: |
          # Get the project ID from GitHub API
          PROJECT_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/snevemoney/n8n-cursor/projects" | \
            jq -r '.[0].id')
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          
      - name: Sync project board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PROJECT_ID: ${{ steps.get-project-id.outputs.project_id }}
        run: |
          python scripts/mcp/project-board-sync.py
          
      - name: Update project status
        if: always()
        run: |
          # Update the project status based on recent activity
          echo "Project board sync completed at $(date)"
          
      - name: Create sync summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // Create a summary comment on the latest commit
            const summary = `## 📊 Project Board Sync Summary
            
            **Last Sync**: ${new Date().toISOString()}
            **Status**: ${context.job === 'success' ? '✅ Success' : '❌ Failed'}
            **Workflow**: ${context.workflow}
            
            **Recent Updates**:
            - GitHub Actions status synced
            - Project board items updated
            - Real-time metrics refreshed
            
            **Next Sync**: In 5 minutes
            
            ---
            *Auto-generated by Project Board Sync workflow*`;
            
            // Try to add a comment to the latest commit
            try {
              const commits = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });
              
              if (commits.data.length > 0) {
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: commits.data[0].sha,
                  body: summary
                });
              }
            } catch (error) {
              console.log('Could not create commit comment:', error.message);
            }
