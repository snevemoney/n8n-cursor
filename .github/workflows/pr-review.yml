name: PR Review & Policy Enforcement
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  policy-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install js-yaml
          npm install -g @github/super-linter
      
      - name: Run Repo Brain analysis
        run: |
          echo "🔍 Analyzing PR structure and policy compliance..."
          node apps/repo-brain/cli/enforce.mjs --staged || true
      
      - name: Generate PR review
        id: review
        run: |
          echo "📝 Generating comprehensive PR review..."
          
          # Get PR details
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          
          # Analyze changes
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          ADDED_FILES=$(git diff --name-only --diff-filter=A origin/main...HEAD)
          MODIFIED_FILES=$(git diff --name-only --diff-filter=M origin/main...HEAD)
          DELETED_FILES=$(git diff --name-only --diff-filter=D origin/main...HEAD)
          
          # Count by type
          SCRIPT_COUNT=$(echo "$CHANGED_FILES" | grep -c "\.sh$" || echo "0")
          WORKFLOW_COUNT=$(echo "$CHANGED_FILES" | grep -c "\.json$" || echo "0")
          CONFIG_COUNT=$(echo "$CHANGED_FILES" | grep -c "\.yml$\|\.yaml$" || echo "0")
          DOC_COUNT=$(echo "$CHANGED_FILES" | grep -c "\.md$" || echo "0")
          
          # Structure analysis
          ROOT_FILES=$(echo "$CHANGED_FILES" | grep -c "^[^/]*\.[a-zA-Z]*$" || echo "0")
          FORBIDDEN_PATHS=$(echo "$CHANGED_FILES" | grep -E "(node_modules|logs|backups|PROTECTED_|workflow_data)" | wc -l || echo "0")
          
          # Generate review body
          REVIEW_BODY="## 🔍 PR Policy Review
          
          ### 📊 Change Summary
          - **Total files changed:** $(echo "$CHANGED_FILES" | wc -l | tr -d ' ')
          - **Added:** $(echo "$ADDED_FILES" | wc -l | tr -d ' ')
          - **Modified:** $(echo "$MODIFIED_FILES" | wc -l | tr -d ' ')
          - **Deleted:** $(echo "$DELETED_FILES" | wc -l | tr -d ' ')
          
          ### 📁 File Type Breakdown
          - **Scripts (.sh):** $SCRIPT_COUNT
          - **Workflows (.json):** $WORKFLOW_COUNT
          - **Configs (.yml/.yaml):** $CONFIG_COUNT
          - **Documentation (.md):** $DOC_COUNT
          
          ### 🚨 Policy Compliance
          - **Root-level files:** $ROOT_FILES $(if [ "$ROOT_FILES" -gt 0 ]; then echo "⚠️"; else echo "✅"; fi)
          - **Forbidden paths:** $FORBIDDEN_PATHS $(if [ "$FORBIDDEN_PATHS" -gt 0 ]; then echo "❌"; else echo "✅"; fi)
          
          ### 💡 Recommendations"
          
          # Add specific recommendations
          if [ "$ROOT_FILES" -gt 0 ]; then
            REVIEW_BODY="$REVIEW_BODY
          - **Move root files to appropriate directories:**
            $(echo "$CHANGED_FILES" | grep "^[^/]*\.[a-zA-Z]*$" | head -5 | sed 's/^/    - /')"
          fi
          
          if [ "$FORBIDDEN_PATHS" -gt 0 ]; then
            REVIEW_BODY="$REVIEW_BODY
          - **Remove or relocate forbidden files:**
            $(echo "$CHANGED_FILES" | grep -E "(node_modules|logs|backups|PROTECTED_|workflow_data)" | head -5 | sed 's/^/    - /')"
          fi
          
          # Add structure suggestions
          REVIEW_BODY="$REVIEW_BODY
          
          ### 🏗️ Structure Guidelines
          - Scripts go in \`scripts/\` subdirectories
          - Workflows go in \`workflows/\`
          - Configs go in \`config/\` or \`infra/\`
          - Documentation goes in \`docs/\`
          - No files at repository root (except README.md, Makefile, etc.)
          
          ### ✅ Pre-commit Checks
          Run these locally before pushing:
          \`\`\`bash
          make guard      # Structure validation
          make fmt        # Format code
          make lint       # Lint scripts
          make ci         # All checks
          \`\`\`
          
          ### 🔒 Security Notes
          - No secrets in code (use environment variables)
          - No MASTER_UNLOCK strings in committed files
          - All scripts must be executable (755 permissions)
          
          ---
          *This review was automatically generated by the Repo Brain policy engine*"
          
          echo "REVIEW_BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            // Check if we already commented
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🔍 PR Policy Review')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '${{ steps.review.outputs.REVIEW_BODY }}'
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '${{ steps.review.outputs.REVIEW_BODY }}'
              });
            }
      
      - name: Check for blocking issues
        run: |
          echo "🔍 Checking for blocking policy violations..."
          
          # Run structure guard
          if ! bash scripts/safety/structure-guard.sh; then
            echo "❌ Structure guard failed - blocking PR"
            exit 1
          fi
          
          # Check for secrets
          if git grep -n "MASTER_UNLOCK\|SSH_KEY\|SUPABASE_SERVICE_ROLE_KEY" -- ':!*.md' ':!*.txt' ':!docs/' ':!config/' >/dev/null 2>&1; then
            echo "❌ Secrets found in code - blocking PR"
            exit 1
          fi
          
          # Check file permissions
          BAD_PERMS=$(find . -name "*.sh" -not -perm 755 | wc -l)
          if [ "$BAD_PERMS" -gt 0 ]; then
            echo "❌ Scripts with incorrect permissions - blocking PR"
            echo "Files with wrong permissions:"
            find . -name "*.sh" -not -perm 755
            exit 1
          fi
          
          echo "✅ No blocking issues found"
      
      - name: Set PR status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ PR passes all policy checks"
          else
            echo "❌ PR has policy violations that must be fixed"
          fi
