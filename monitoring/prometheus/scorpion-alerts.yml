groups:
  - name: scorpion-alerts
    interval: 30s
    rules:
      # Resource Exhaustion Alerts
      - alert: ScorpionHighMemoryUsage
        expr: process_resident_memory_bytes{job="scorpion"} > 1073741824  # 1GB
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scorpion memory usage is high"
          description: "Scorpion is using {{ $value | humanize1024 }} of memory (threshold: 1GB)"

      - alert: ScorpionCriticalMemoryUsage
        expr: process_resident_memory_bytes{job="scorpion"} > 2147483648  # 2GB
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scorpion memory usage is critical"
          description: "Scorpion is using {{ $value | humanize1024 }} of memory (threshold: 2GB). May cause OOM kills."

      - alert: ScorpionHighCPUUsage
        expr: rate(process_cpu_seconds_total{job="scorpion"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scorpion CPU usage is high"
          description: "Scorpion CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"

      # Health Check Alerts
      - alert: ScorpionHealthCheckFailed
        expr: up{job="scorpion"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scorpion health check failed"
          description: "Scorpion health endpoint is not responding"

      - alert: ScorpionHealthCheckDegraded
        expr: scorpion_health_status{status="degraded"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scorpion health is degraded"
          description: "One or more Scorpion systems are reporting warnings"

      # API Error Rate Alerts
      - alert: ScorpionHighErrorRate
        expr: rate(scorpion_api_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in Scorpion API"
          description: "Scorpion API error rate is {{ $value }} errors/second"

      - alert: ScorpionCriticalErrorRate
        expr: rate(scorpion_api_errors_total[5m]) > 1.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate in Scorpion API"
          description: "Scorpion API error rate is {{ $value }} errors/second"

      # Dependency Health Alerts
      - alert: ScorpionSupabaseUnreachable
        expr: scorpion_dependency_health{service="supabase",status="error"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Supabase is unreachable"
          description: "Scorpion cannot connect to Supabase database"

      - alert: ScorpionN8nUnreachable
        expr: scorpion_dependency_health{service="n8n",status="error"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "n8n is unreachable"
          description: "Scorpion cannot connect to n8n instance"

      - alert: ScorpionOllamaUnreachable
        expr: scorpion_dependency_health{service="ollama",status="error"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ollama is unreachable"
          description: "Scorpion cannot connect to Ollama (LLM features may be degraded)"

      # Performance Alerts
      - alert: ScorpionSlowAPIResponse
        expr: histogram_quantile(0.95, rate(scorpion_api_request_duration_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scorpion API responses are slow"
          description: "95th percentile API response time is {{ $value }}s (threshold: 2s)"

      - alert: ScorpionVerySlowAPIResponse
        expr: histogram_quantile(0.95, rate(scorpion_api_request_duration_seconds_bucket[5m])) > 5.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scorpion API responses are very slow"
          description: "95th percentile API response time is {{ $value }}s (threshold: 5s)"

      # Circuit Breaker Alerts
      - alert: ScorpionCircuitBreakerOpen
        expr: scorpion_circuit_breaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker is open"
          description: "Circuit breaker for {{ $labels.service }} is open (too many failures)"

      # Background Job Alerts
      - alert: ScorpionBackgroundJobFailed
        expr: rate(scorpion_background_job_failures_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Background jobs are failing"
          description: "Background job failure rate is {{ $value }} failures/second"

      # Disk Space Alerts (if monitoring disk)
      - alert: ScorpionLowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on Scorpion host"
          description: "Disk space is below 10% ({{ $value | humanizePercentage }} available)"

