groups:
  - name: scorpion_slo
    interval: 30s
    rules:
      # Availability SLO: 99.9% uptime
      - record: scorpion:availability_slo
        expr: |
          (
            sum(rate(scorpion_api_requests_total{status=~"2.."}[5m]))
            /
            sum(rate(scorpion_api_requests_total[5m]))
          ) >= 0.999
        labels:
          slo: availability
          target: "99.9%"
      
      # Latency SLO: 95th percentile < 500ms
      - record: scorpion:latency_slo_p95
        expr: |
          histogram_quantile(0.95, rate(scorpion_api_request_duration_seconds_bucket[5m])) < 0.5
        labels:
          slo: latency_p95
          target: "500ms"
      
      # Error rate SLO: < 0.1% errors
      - record: scorpion:error_rate_slo
        expr: |
          (
            sum(rate(scorpion_api_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(scorpion_api_requests_total[5m]))
          ) < 0.001
        labels:
          slo: error_rate
          target: "<0.1%"
      
      # Health check SLO: > 99.5% successful health checks
      - record: scorpion:health_check_slo
        expr: |
          (
            sum(rate(scorpion_navigation_requests_total{route="/healthz",status="200"}[5m]))
            /
            sum(rate(scorpion_navigation_requests_total{route="/healthz"}[5m]))
          ) >= 0.995
        labels:
          slo: health_check
          target: "99.5%"

