# Dynamic Project Board Configuration
# This file drives the auto-updating GitHub Projects board

project:
  name: "n8n-cursor"
  description: "AI-Powered Workflow Automation with MCP Integration"
  
# Board Structure with Time Awareness
columns:
  - name: "Backlog"
    description: "Items waiting to be prioritized"
    color: "green"
    auto_populate: true
    time_tracking: true
    
  - name: "Ready"
    description: "Ready for development"
    color: "blue"
    auto_populate: true
    time_tracking: true
    
  - name: "In Progress"
    description: "Currently being worked on"
    color: "orange"
    auto_populate: true
    time_tracking: true
    
  - name: "In Review"
    description: "Ready for review/testing"
    color: "purple"
    auto_populate: true
    time_tracking: true
    
  - name: "Done"
    description: "Completed items"
    color: "gray"
    auto_populate: true
    time_tracking: true
    auto_archive: true
    
  - name: "Future Roadmap"
    description: "Planned features and enhancements"
    color: "cyan"
    auto_populate: true
    time_tracking: true
    scheduled: true
    
  - name: "Issues & Gaps"
    description: "Identified problems and missing pieces"
    color: "red"
    auto_populate: true
    time_tracking: true
    priority: "high"

# Master Roadmap Configuration with Advanced Features
master_roadmap:
  enabled: true
  data_sources:
    - chat_history: true
    - vector_embeddings: true
    - github_issues: true
    - workflow_analysis: true
    - notes_analysis: true
    - commentary_tracking: true
    
  # Advanced Timeline Features
  timeline_features:
    - github_milestones: true
    - release_planning: true
    - sprint_planning: true
    - dependency_mapping: true
    - critical_path_analysis: true
    - resource_allocation: true
    
  # Comprehensive Categories with Notes
  categories:
    - name: "Infrastructure & DevOps"
      priority: "critical"
      timeline: "immediate"
      notes: "Core infrastructure that everything else depends on"
      gaps: "Multi-cloud setup, advanced monitoring"
      next_steps: "Implement SOC2 compliance, add multi-region support"
      
    - name: "n8n Workflows"
      priority: "high"
      timeline: "short-term"
      notes: "Core automation workflows and integrations"
      gaps: "Advanced error handling, workflow optimization"
      next_steps: "Add workflow testing, implement rollback mechanisms"
      
    - name: "AI & MCP Integration"
      priority: "high"
      timeline: "medium-term"
      notes: "AI-powered features and MCP tool integration"
      gaps: "Vector database setup, AI model integration"
      next_steps: "Set up pgvector, integrate OpenAI embeddings"
      
    - name: "Security & Monitoring"
      priority: "critical"
      timeline: "ongoing"
      notes: "Security hardening and comprehensive monitoring"
      gaps: "Threat detection, compliance reporting"
      next_steps: "Implement SIEM, add compliance dashboards"
      
    - name: "Documentation & Training"
      priority: "medium"
      timeline: "long-term"
      notes: "User guides, API docs, and training materials"
      gaps: "Video tutorials, interactive documentation"
      next_steps: "Create video series, build interactive docs"

# Advanced Notes & Commentary System
notes_system:
  enabled: true
  
  # Note Types
  note_types:
    - type: "technical_notes"
      description: "Technical implementation details and decisions"
      required: true
      
    - type: "business_context"
      description: "Business requirements and stakeholder needs"
      required: false
      
    - type: "lessons_learned"
      description: "What we learned during implementation"
      required: true
      
    - type: "potential_issues"
      description: "Identified risks and potential problems"
      required: true
      
    - type: "resolutions"
      description: "How we solved specific problems"
      required: true
      
    - type: "gaps"
      description: "Missing pieces and areas for improvement"
      required: true
      
    - type: "next_steps"
      description: "What needs to be done next"
      required: true
      
    - type: "schedule_notes"
      description: "Timeline considerations and scheduling notes"
      required: true

# Issue Resolution Tracking
issue_tracking:
  enabled: true
  
  # Resolution Status
  resolution_statuses:
    - status: "identified"
      description: "Issue has been identified but not yet addressed"
      color: "red"
      
    - status: "investigating"
      description: "Issue is being investigated and analyzed"
      color: "orange"
      
    - status: "in_progress"
      description: "Issue is being actively worked on"
      color: "yellow"
      
    - status: "testing"
      description: "Fix is implemented and being tested"
      color: "blue"
      
    - status: "resolved"
      description: "Issue has been successfully resolved"
      color: "green"
      
    - status: "verified"
      description: "Resolution has been verified and documented"
      color: "darkgreen"
      
    - status: "closed"
      description: "Issue is completely closed and archived"
      color: "gray"
  
  # Issue Categories
  issue_categories:
    - category: "bug"
      description: "Software bugs and errors"
      priority: "high"
      
    - category: "performance"
      description: "Performance issues and bottlenecks"
      priority: "medium"
      
    - category: "security"
      description: "Security vulnerabilities and concerns"
      priority: "critical"
      
    - category: "usability"
      description: "User experience and interface issues"
      priority: "medium"
      
    - category: "infrastructure"
      description: "Infrastructure and deployment issues"
      priority: "high"
      
    - category: "documentation"
      description: "Missing or incorrect documentation"
      priority: "low"

# Gap Analysis System
gap_analysis:
  enabled: true
  
  # Gap Categories
  gap_categories:
    - category: "technical_gaps"
      description: "Missing technical capabilities or features"
      
    - category: "process_gaps"
      description: "Missing or inefficient processes"
      
    - category: "knowledge_gaps"
      description: "Missing knowledge or expertise"
      
    - category: "tool_gaps"
      description: "Missing tools or integrations"
      
    - category: "security_gaps"
      description: "Missing security measures or controls"
      
    - category: "monitoring_gaps"
      description: "Missing monitoring or observability"
  
  # Gap Severity Levels
  gap_severity:
    - level: "critical"
      description: "Must be addressed immediately"
      impact: "Blocks core functionality"
      
    - level: "high"
      description: "Should be addressed soon"
      impact: "Significantly affects operations"
      
    - level: "medium"
      description: "Should be addressed in next iteration"
      impact: "Moderately affects operations"
      
    - level: "low"
      description: "Nice to have"
      impact: "Minimal impact on operations"

# Masterful Timeline Configuration
master_timeline:
  enabled: true
  
  # Timeline Granularity
  granularity: "days"  # days, weeks, months, quarters
  
  # Timeline Views
  timeline_views:
    - view: "overview"
      description: "High-level timeline with major milestones"
      zoom_level: "months"
      
    - view: "detailed"
      description: "Detailed timeline with all items"
      zoom_level: "weeks"
      
    - view: "sprint"
      description: "Sprint-based timeline view"
      zoom_level: "days"
      
    - view: "release"
      description: "Release planning timeline"
      zoom_level: "weeks"
      
    - view: "roadmap"
      description: "Long-term roadmap view"
      zoom_level: "quarters"
  
  # GitHub Integration
  github_integration:
    - milestones: true
      auto_create: true
      sync_frequency: "daily"
      
    - releases: true
      auto_create: true
      version_scheme: "semantic"
      
    - projects: true
      auto_sync: true
      column_mapping: true
      
    - issues: true
      auto_link: true
      dependency_tracking: true

# Time-Aware Task Tracking with Advanced Features
time_tracking:
  enabled: true
  granularity: "seconds"  # Track down to second-level updates
  
  # Past tracking with rich metadata
  past_tracking:
    enabled: true
    retention_days: 365
    include_resolved: true
    include_archived: true
    include_notes: true
    include_commentary: true
    include_lessons_learned: true
    
  # Present tracking with real-time insights
  present_tracking:
    enabled: true
    real_time_updates: true
    status_change_tracking: true
    fix_time_tracking: true
    issue_resolution_tracking: true
    gap_identification: true
    next_step_tracking: true
    
  # Future planning with comprehensive analysis
  future_planning:
    enabled: true
    roadmap_planning: true
    milestone_tracking: true
    dependency_mapping: true
    resource_planning: true
    risk_assessment: true
    timeline_optimization: true

# MCP Integration Rules with Advanced Features
mcp_integration:
  # Auto-create items from GitHub Actions with comprehensive tracking
  github_actions:
    - workflow: "Deploy"
      trigger: "on_success"
      action: "create_item"
      column: "Done"
      title: "Deployment Successful - {{ env }}"
      body: "Environment: {{ env }}\nBranch: {{ branch }}\nSHA: {{ sha }}\nCompleted: {{ timestamp }}"
      time_tracking: true
      auto_archive: "7d"
      notes:
        - type: "technical_notes"
          content: "Deployment completed successfully with all health checks passing"
        - type: "lessons_learned"
          content: "Self-healing pipeline working as expected"
        - type: "next_steps"
          content: "Monitor performance metrics for next 24 hours"
      
    - workflow: "Deploy"
      trigger: "on_failure"
      action: "create_item"
      column: "Issues & Gaps"
      title: "🚨 Deployment Failed - {{ env }}"
      body: "Environment: {{ env }}\nBranch: {{ branch }}\nSHA: {{ sha }}\nDetected: {{ timestamp }}\nPriority: High\nEstimated Fix Time: 30m"
      time_tracking: true
      priority: "high"
      estimated_fix_time: "30m"
      notes:
        - type: "potential_issues"
          content: "Deployment failure indicates infrastructure or configuration problem"
        - type: "resolutions"
          content: "Check logs, verify configuration, test in staging first"
        - type: "next_steps"
          content: "Investigate root cause, implement fix, add monitoring"
      
    - workflow: "Disaster Recovery"
      trigger: "on_failure"
      action: "create_item"
      column: "Issues & Gaps"
      title: "🚨 Health Check Failed - {{ env }}"
      body: "Environment: {{ env }}\nEndpoint: {{ secrets.HEALTH_URL }}\nDetected: {{ timestamp }}\nPriority: Critical\nEstimated Fix Time: 15m"
      time_tracking: true
      priority: "critical"
      estimated_fix_time: "15m"
      notes:
        - type: "potential_issues"
          content: "Health check failure indicates service degradation or outage"
        - type: "resolutions"
          content: "Check service status, restart if needed, verify dependencies"
        - type: "next_steps"
          content: "Implement auto-recovery, add alerting, document procedures"
      
  # Real-time n8n status updates with comprehensive tracking
  n8n_status:
    - check_interval: "30s"  # Check every 30 seconds for real-time updates
      action: "update_health_status"
      columns: ["Ready", "In Progress"]
      time_tracking: true
      notes:
        - type: "technical_notes"
          content: "Real-time monitoring of n8n workflow health and performance"
        - type: "next_steps"
          content: "Implement predictive maintenance, add performance optimization"
      
  # Auto-archive with comprehensive metadata
  auto_archive:
    - condition: "status:done"
      action: "move_to_done"
      after: "24h"
      time_tracking: true
      notes:
        - type: "lessons_learned"
          content: "Task completed successfully, archive for future reference"
      
    - condition: "status:resolved"
      action: "archive"
      after: "7d"
      time_tracking: true
      notes:
        - type: "resolutions"
          content: "Issue resolved, archive for knowledge base"

# Smart Automation Rules with Advanced Intelligence
automation:
  # Auto-assign based on labels, time, and expertise
  auto_assign:
    - label: "bug"
      assignee: "snevemoney"
      priority: "high"
      estimated_fix_time: "30m"
      time_tracking: true
      notes:
        - type: "technical_notes"
          content: "Bug fixes automatically assigned to primary developer"
      
    - label: "enhancement"
      assignee: "snevemoney"
      priority: "medium"
      estimated_fix_time: "2h"
      time_tracking: true
      notes:
        - type: "business_context"
          content: "Enhancements assigned based on priority and complexity"
      
    - label: "deployment"
      assignee: "snevemoney"
      priority: "high"
      estimated_fix_time: "15m"
      time_tracking: true
      notes:
        - type: "technical_notes"
          content: "Deployment issues require immediate attention"
      
  # Auto-label based on content and context
  auto_label:
    - pattern: "deploy|deployment|ci/cd"
      labels: ["deployment", "automation"]
      notes:
        - type: "technical_notes"
          content: "Automatically labeled as deployment-related"
      
    - pattern: "bug|fix|issue"
      labels: ["bug", "urgent"]
      notes:
        - type: "potential_issues"
          content: "Automatically identified as bug or issue"
      
    - pattern: "feature|enhancement|improvement"
      labels: ["enhancement", "feature"]
      notes:
        - type: "business_context"
          content: "Automatically identified as feature or enhancement"
      
  # Time-based task routing with intelligent analysis
  time_based_routing:
    - condition: "fix_time < 30s"
      action: "move_to_done"
      label: "quick-fix"
      time_tracking: true
      notes:
        - type: "lessons_learned"
          content: "Quick fix completed, moved to done column"
      
    - condition: "fix_time > 2h"
      action: "escalate"
      label: "complex-issue"
      time_tracking: true
      notes:
        - type: "potential_issues"
          content: "Complex issue detected, escalated for review"

# Real-Time Updates with Advanced Web Interface
real_time:
  enabled: true
  update_interval: "30s"  # Update every 30 seconds
  web_interface: true
  
  webhook_endpoints:
    - github_actions
    - n8n_webhooks
    - manual_updates
    - time_tracking_updates
    - notes_updates
    - commentary_updates
    
  # Advanced web interface features
  web_features:
    - live_updates: true
    - real_time_chat: true
    - timeline_view: true
    - roadmap_view: true
    - metrics_dashboard: true
    - mobile_responsive: true
    - notes_editor: true
    - commentary_system: true
    - gap_analysis_view: true
    - issue_tracking_view: true
    - timeline_optimization: true
    - resource_allocation_view: true

# Comprehensive Metrics and Insights with Advanced Analytics
metrics:
  - name: "Deployment Success Rate"
    source: "github_actions"
    calculation: "successful_deployments / total_deployments"
    time_tracking: true
    notes:
      - type: "technical_notes"
        content: "Track deployment reliability and identify patterns"
    
  - name: "Health Check Status"
    source: "disaster_recovery"
    calculation: "healthy_checks / total_checks"
    time_tracking: true
    notes:
      - type: "technical_notes"
        content: "Monitor system health and identify degradation patterns"
    
  - name: "Issue Resolution Time"
    source: "project_items"
    calculation: "average_time_to_resolution"
    time_tracking: true
    granularity: "seconds"
    notes:
      - type: "lessons_learned"
        content: "Track efficiency improvements and identify bottlenecks"
    
  - name: "Workflow Performance"
    source: "n8n_executions"
    calculation: "successful_executions / total_executions"
    time_tracking: true
    notes:
      - type: "technical_notes"
        content: "Monitor n8n workflow reliability and performance"
    
  - name: "Quick Fix Rate"
    source: "time_tracking"
    calculation: "fixes_completed_under_30s / total_fixes"
    time_tracking: true
    notes:
      - type: "lessons_learned"
        content: "Track efficiency and identify quick win opportunities"
    
  - name: "Roadmap Progress"
    source: "master_roadmap"
    calculation: "completed_milestones / total_milestones"
    time_tracking: true
    notes:
      - type: "business_context"
        content: "Track overall project progress and milestone completion"
    
  - name: "Gap Closure Rate"
    source: "gap_analysis"
    calculation: "resolved_gaps / total_gaps"
    time_tracking: true
    notes:
      - type: "next_steps"
        content: "Track progress in addressing identified gaps"
    
  - name: "Issue Resolution Quality"
    source: "issue_tracking"
    calculation: "verified_resolutions / total_resolutions"
    time_tracking: true
    notes:
      - type: "lessons_learned"
        content: "Track quality of issue resolution and verification"

# Advanced Chat History Integration for Roadmap
chat_integration:
  enabled: true
  sources:
    - cursor_chat_history: true
    - github_discussions: true
    - issue_comments: true
    - pull_request_reviews: true
    - commit_messages: true
    
  analysis:
    - sentiment_analysis: true
    - priority_extraction: true
    - timeline_extraction: true
    - dependency_mapping: true
    - issue_identification: true
    - gap_detection: true
    - resolution_tracking: true
    - next_step_extraction: true
    
  auto_roadmap:
    - extract_features: true
    - estimate_timelines: true
    - assign_priorities: true
    - create_milestones: true
    - identify_gaps: true
    - track_resolutions: true
    - suggest_next_steps: true

# Vector Embeddings for Advanced Intelligence
vector_integration:
  enabled: true
  embeddings:
    - source: "chat_history"
      model: "text-embedding-ada-002"
      dimensions: 1536
      
    - source: "github_issues"
      model: "text-embedding-ada-002"
      dimensions: 1536
      
    - source: "workflow_analysis"
      model: "text-embedding-ada-002"
      dimensions: 1536
    
    - source: "notes_and_commentary"
      model: "text-embedding-ada-002"
      dimensions: 1536
    
    - source: "gap_analysis"
      model: "text-embedding-ada-002"
      dimensions: 1536
  
  similarity_search:
    enabled: true
    threshold: 0.85
    max_results: 10
    
  smart_routing:
    enabled: true
    based_on: ["similarity", "priority", "timeline", "expertise", "notes", "commentary"]
    
  auto_categorization:
    enabled: true
    categories: ["infrastructure", "workflows", "ai", "security", "documentation", "issues", "gaps"]
    
  intelligent_insights:
    enabled: true
    features:
      - pattern_recognition: true
      - trend_analysis: true
      - risk_assessment: true
      - opportunity_identification: true
      - dependency_discovery: true
