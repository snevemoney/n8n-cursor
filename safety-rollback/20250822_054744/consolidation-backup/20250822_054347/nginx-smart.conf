# 🚀 SMART NGINX CONFIGURATION - "AI Protecting AI" Architecture
# 🛡️ Auto-detects running n8n instances, prevents conflicts
# 🔒 Production-ready with automatic failover

# Upstream definitions - smart service discovery
upstream n8n_system {
    server 127.0.0.1:5678 max_fails=3 fail_timeout=30s;
}

upstream n8n_docker {
    server 127.0.0.1:15678 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:15679 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:15680 max_fails=3 fail_timeout=30s;
}

# Health check map - determines which n8n is healthy
map $http_x_health_check $n8n_backend {
    default "";
    "system" "n8n_system";
    "docker" "n8n_docker";
}

# Smart backend selection - auto-detects running services
map $http_x_backend $smart_backend {
    default "";
    "system" "n8n_system";
    "docker" "n8n_docker";
}

# HTTP → HTTPS redirect (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name n8ncloud.tech www.n8ncloud.tech;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect to HTTPS
    return 301 https://n8ncloud.tech$request_uri;
}

# HTTPS main server - smart routing
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8ncloud.tech www.n8ncloud.tech;
    
    # Redirect www → apex for OAuth compatibility
    if ($host = www.n8ncloud.tech) {
        return 301 https://n8ncloud.tech$request_uri;
    }
    
    # SSL Configuration - production-ready
    ssl_certificate     /etc/letsencrypt/live/n8ncloud.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8ncloud.tech/privkey.pem;
    
    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Client settings
    client_max_body_size 50m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Proxy settings
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;
    
    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Smart n8n routing - auto-detects running instance
    location / {
        # Try Docker first (isolated, preferred)
        proxy_pass http://n8n_docker;
        
        # Fallback to system n8n if Docker is down
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        
        # Health check headers
        proxy_set_header X-Health-Check "true";
        proxy_set_header X-Backend "docker";
    }
    
    # API endpoints
    location /rest/ {
        proxy_pass http://n8n_docker;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
    
    # Webhook endpoints
    location /webhook/ {
        proxy_pass http://n8n_docker;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
    
    # Webhook testing
    location /webhook-test/ {
        proxy_pass http://n8n_docker;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
    
    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://n8n_docker;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Docker isolation server - dedicated access
server {
    listen 15680;
    server_name docker.n8ncloud.tech;
    
    # Basic auth for Docker access
    auth_basic "Docker N8N Access";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    location / {
        proxy_pass http://n8n_docker;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# System n8n access (if needed)
server {
    listen 15681;
    server_name system.n8ncloud.tech;
    
    # Basic auth for system access
    auth_basic "System N8N Access";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    location / {
        proxy_pass http://n8n_system;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Monitoring and status endpoints
server {
    listen 15682;
    server_name status.n8ncloud.tech;
    
    location / {
        # Return system status
        return 200 "N8N Smart Configuration Active\nDocker: $upstream_addr\nSystem: $upstream_addr\n";
        add_header Content-Type text/plain;
    }
    
    location /status {
        # Detailed status
        stub_status on;
        access_log off;
    }
}
