# PROJECTS.yaml - Project Boundaries and Allowed Paths
# This file defines the contract for what Cursor can and cannot touch

projects:
  lfai:
    name: "LightningFlow AI"
    description: "Main LightningFlow AI application and services"
    # Public URL: https://evenslouis.ca/lightningflow
    # Legacy domain: lightningflow.online (redirect + API compatibility only)
    allowed_paths:
      - "apps/lightningflow/**"
      - "packages/lf-sdk/**"
      - "packages/shared-*/**"
      - "infra/docker/docker-compose.*.yml"
      - "infra/caddy/**"
      - "infra/systemd/**"
      - "sql/lightningflow.sql"
      - "docs/lightningflow/**"
    excluded_paths:
      - "apps/n8n-cursor/**"  # Keep separate from side hustle workflows
      - "workflows/**"         # n8n workflows are separate
      - "mcp/side-hustle/**"   # Side hustle MCP server
    ports:
      - 3201  # path landing
      - 3202  # customer web + API
      - 3203  # ops
    health_endpoints:
      - "https://evenslouis.ca/lightningflow/healthz"
      - "https://evenslouis.ca/lightningflow/api/healthz"
      - "https://evenslouis.ca/lightningflow/ops/healthz"

  n8n-cursor:
    name: "n8n Cursor Side Hustle"
    description: "n8n workflows and automation for side hustle projects"
    # Public URL: https://evenslouis.ca/n8n (legacy dual-host: n8ncloud.tech)
    # Live VPS compose: /home/evens/n8n-cursor/docker-compose.yml
    # Data volume: n8n-cursor_n8n_data (SQLite) — never prune / recreate empty
    # Image pin: n8nio/n8n:2.34.1
    allowed_paths:
      - "apps/n8n-cursor/**"
      - "workflows/**"
      - "mcp/side-hustle/**"
      - "tools/mcp-servers/**"
      - "scripts/n8n-*.sh"
      - "docs/workflows/**"
      - "infra/docker/docker-compose.n8n-evenslouis.yml"
      - "infra/caddy/Caddyfile.evenslouis.prod"
    excluded_paths:
      - "apps/lightningflow/**"  # Keep separate from main app
      - "packages/lf-sdk/**"     # Main app SDK
    ports:
      - 5678  # n8n (127.0.0.1 only; public via Caddy /n8n)
    health_endpoints:
      - "http://127.0.0.1:5678/healthz"
      - "https://evenslouis.ca/n8n/healthz"

  shared:
    name: "Shared Infrastructure"
    description: "Shared infrastructure, monitoring, and tooling"
    allowed_paths:
      - "infra/**"
      - "monitoring/**"
      - "scripts/validate/**"
      - "tooling/**"
      - "docs/setup/**"
      - "env-templates/**"
    excluded_paths:
      - "apps/**"      # App-specific code
      - "packages/**"  # App-specific packages
      - "workflows/**" # n8n workflows
    ports:
      - 80    # Caddy HTTP
      - 443   # Caddy HTTPS
      - 3000  # Grafana
      - 9090  # Prometheus
      - 3100  # Loki
    health_endpoints:
      - "http://localhost:3000/healthz"
      - "http://localhost:9090/healthz"
      - "http://localhost:3100/healthz"

# Global Rules
global_rules:
  port_binding:
    rule: "All container ports MUST bind to 127.0.0.1:PORT:PORT"
    exception: "Only Caddy can bind to 0.0.0.0 for public ingress"
  
  health_checks:
    rule: "All services MUST have /healthz endpoints"
    timeout: "10s"
    interval: "30s"
    retries: 3
  
  resource_limits:
    rule: "All services MUST have CPU and memory limits"
    default_cpu: "1.0"
    default_memory: "512M"
  
  security:
    rule: "No real secrets in code - only .env.*.example files"
    validation: "All inputs must be validated and sanitized"
  
  rollback:
    rule: "Every change MUST include complete rollback instructions"
    components: ["docker", "git", "database", "caddy", "environment"]

# Environment Matrix
environments:
  int:
    compose_file: "infra/docker/docker-compose.int.yml"
    domain: "dev.lightningflow.online"
    data_root: "/opt/lfai/int"
    log_level: "debug"
  
  staging:
    compose_file: "infra/docker/docker-compose.staging.yml"
    domain: "staging.lightningflow.online"
    data_root: "/opt/lfai/staging"
    log_level: "info"
  
  prod:
    compose_file: "infra/docker/docker-compose.prod.yml"
    domain: "lightningflow.online"
    data_root: "/opt/lfai/prod"
    log_level: "warn"

# Validation Rules
validation:
  scope_check:
    rule: "All file changes must be within declared AFFECTED_PATHS"
    tool: "scripts/validate/scope-check.sh"
  
  port_check:
    rule: "No public port bindings allowed"
    tool: "scripts/validate/ports-check.sh"
  
  health_check:
    rule: "All services must have health endpoints"
    tool: "scripts/validate/health-check.sh"
  
  security_check:
    rule: "No secrets, proper validation, secure defaults"
    tool: "scripts/validate/security-check.sh"