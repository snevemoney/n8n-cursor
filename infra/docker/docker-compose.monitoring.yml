name: monitoring_stack
x:dflt: &dflt
  restart: unless-stopped
  init: true
  networks: [monitoring]
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

services:
  # Prometheus - Metrics Collection
  prometheus:
    <<: *dflt
    image: prom/prometheus:v2.47.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ../../monitoring/alertmanager/scorpion-alerts.yml:/etc/prometheus/rules/scorpion-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck: { test: ["CMD","wget","-qO-","http://localhost:9090/-/healthy"], interval: 30s, timeout: 10s, retries: 3 }
    cpus: "1"; mem_limit: "2g"; pids_limit: 200

  # AlertManager - Alert Routing
  alertmanager:
    <<: *dflt
    image: prom/alertmanager:v0.26.0
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    healthcheck: { test: ["CMD","wget","-qO-","http://localhost:9093/-/healthy"], interval: 30s, timeout: 10s, retries: 3 }
    cpus: "0.5"; mem_limit: "512m"; pids_limit: 100

  # Loki - Log Aggregation
  loki:
    <<: *dflt
    image: grafana/loki:2.9.0
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ../../monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck: { test: ["CMD","wget","-qO-","http://localhost:3100/ready"], interval: 30s, timeout: 10s, retries: 3 }
    cpus: "1"; mem_limit: "2g"; pids_limit: 200

  # Promtail - Log Collection
  promtail:
    <<: *dflt
    image: grafana/promtail:2.9.0
    volumes:
      - ../../monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    healthcheck: { test: ["CMD","wget","-qO-","http://localhost:9080/ready"], interval: 30s, timeout: 10s, retries: 3 }
    cpus: "0.5"; mem_limit: "512m"; pids_limit: 100
    depends_on:
      - loki

  # Grafana - Dashboards & Visualization
  grafana:
    <<: *dflt
    image: grafana/grafana:10.2.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck: { test: ["CMD","wget","-qO-","http://localhost:3000/api/health"], interval: 30s, timeout: 10s, retries: 3 }
    cpus: "0.5"; mem_limit: "512m"; pids_limit: 100
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  promtail_positions:
  grafana_data:

networks:
  monitoring: { driver: bridge }

