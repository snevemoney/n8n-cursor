<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>J.A.R.V.I.S.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #020805;
      --forest: #03140c;
      --trace: #1f6b3a;
      --neon: #3dff6a;
      --mint: #b8ffc9;
      --amber: #e0a24a;
      --ink: #041208;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--void); color: var(--mint);
      font-family: "Share Tech Mono", ui-monospace, monospace;
    }
    #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
    #graph {
      position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%;
      pointer-events: auto; /* dock sits above; do not set none to save MIC */
    }
    body.has-graph #board { display: none; }
    body.has-graph:not(.widget) #orb3d { display: none; }
    .hud {
      position: fixed; z-index: 2; pointer-events: none;
      letter-spacing: .18em; font-size: 12px; color: #d8ffe4;
      text-shadow: 0 0 10px rgba(61, 255, 106, .35);
    }
    .sense, #dock {
      pointer-events: auto; display: flex; gap: 8px;
      position: fixed; z-index: 8; top: 228px; left: 28px;
    }
    .sense button, #dock button, #micBtn {
      pointer-events: auto; position: relative; z-index: 1;
      background: rgba(2, 10, 6, .72); color: var(--mint);
      border: 1px solid rgba(61, 255, 106, .45);
      font: 10px "Share Tech Mono", ui-monospace, monospace;
      letter-spacing: .2em; padding: 6px 10px; cursor: pointer;
    }
    .sense button.on { border-color: var(--amber); color: var(--amber); }
    #eyesPreview {
      display: none; margin-top: 8px; width: 132px; height: 88px;
      object-fit: cover; border: 1px solid rgba(61, 255, 106, .35);
      background: #020805;
    }
    #eyesPreview.on { display: block; }
    .hud.tl { top: 22px; left: 28px; }
    .hud.tr { top: 22px; right: 28px; text-align: right; display: flex; align-items: flex-start; gap: 14px; }
    .hud.bl { bottom: 22px; left: 28px; }
    .hud.br { bottom: 22px; right: 28px; text-align: right; }
    .hud .name { font-size: 15px; letter-spacing: .42em; }
    .hud .sub { opacity: .7; margin-top: 6px; letter-spacing: .22em; font-size: 10px; }
    .dots { display: flex; gap: 10px; margin-top: 8px; }
    .dots span { display: inline-flex; align-items: center; gap: 5px; letter-spacing: .16em; font-size: 10px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: #1a3a22; box-shadow: none; }
    .dots span.on i { background: var(--neon); box-shadow: 0 0 8px var(--neon); }
    .dots span.off i { background: #3a2018; }
    .phase { font-size: 18px; letter-spacing: .34em; }
    .clock { opacity: .75; margin-top: 6px; letter-spacing: .2em; }
    .orb {
      width: 18px; height: 18px; border-radius: 50%; margin-top: 4px;
      background: radial-gradient(circle at 35% 30%, #e8ffe8, var(--neon) 45%, #0b3d1c 80%);
      box-shadow: 0 0 18px var(--neon); animation: pulse 1.8s ease-in-out infinite;
    }
    body.listen .orb { animation-duration: 1.1s; }
    body.think .orb { animation-duration: .7s; box-shadow: 0 0 22px var(--amber); }
    body.speak .orb { animation-duration: .9s; }
    @keyframes pulse { 50% { transform: scale(1.25); opacity: .75; } }
    .chip {
      position: fixed; z-index: 3; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      min-width: min(72vw, 640px); min-height: 88px;
      padding: 22px 36px; text-align: center;
      background: rgba(2, 10, 6, .62);
      border: 1px solid rgba(61, 255, 106, .55);
      box-shadow: 0 0 40px rgba(61, 255, 106, .22), inset 0 0 40px rgba(61, 255, 106, .06);
      pointer-events: auto; cursor: pointer;
    }
    .chip .mark {
      font-size: clamp(28px, 5vw, 48px); letter-spacing: .42em;
      margin-left: .42em; color: #f4fff6;
      text-shadow: 0 0 18px rgba(61, 255, 106, .55);
    }
    body.listen .chip { border-color: #7dcea0; }
    body.think .chip {
      border-color: var(--amber);
      animation: thinkGlow .55s ease-in-out infinite alternate;
    }
    body.speak .chip { box-shadow: 0 0 70px rgba(61, 255, 106, .38); }
    body.think #graph { opacity: .7; filter: saturate(1.25); }
    @keyframes thinkGlow {
      from { box-shadow: 0 0 22px rgba(224, 162, 74, .28); }
      to { box-shadow: 0 0 64px rgba(224, 162, 74, .72); border-color: #ffd27a; }
    }
    .chip .line {
      margin-top: 12px; font-size: 16px; letter-spacing: .03em; line-height: 1.4;
      color: #e8ffe8; max-width: 36em; margin-left: auto; margin-right: auto;
    }
    .chip .ask { color: var(--amber); }
    #wave { width: 100%; height: 46px; display: none; }
    body.listen #wave, body.think #wave, body.speak #wave { display: block; }
    body.think .mark { letter-spacing: .18em; font-size: 22px; }
    input#typed {
      position: fixed; z-index: 4; left: 50%; bottom: 64px;
      transform: translateX(-50%); width: min(70vw, 520px);
      background: rgba(2, 10, 6, .7); color: var(--mint);
      border: 1px solid rgba(61, 255, 106, .3); padding: 8px 12px;
      font: 12px "Share Tech Mono", ui-monospace, monospace; letter-spacing: .08em;
      display: none;
    }
    input#typed.on { display: block; }
    #orb3d {
      position: fixed; z-index: 2; left: 50%; top: 50%;
      width: min(72vw, 420px); height: min(72vw, 420px);
      transform: translate(-50%, -58%); pointer-events: none;
    }
    .sense .ico { display: none; width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    html.widget, html.widget body {
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
      cursor: grab;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      letter-spacing: 0;
      text-shadow: none;
    }
    html.widget body, html.widget button, html.widget input, html.widget #spoken {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      letter-spacing: 0 !important;
      text-shadow: none !important;
      -webkit-text-stroke: 0 !important;
    }
    html.widget .sense, html.widget .sense button, html.widget #dock, html.widget #dock button { cursor: pointer; }
    html.widget #board, html.widget #graph, html.widget .hud,
    html.widget .chip .mark, html.widget #wave,
    html.widget .orb, html.widget #eyesPreview { display: none !important; }
    html.widget #typed,
    html.widget #typed.on {
      display: block !important;
      pointer-events: auto;
      z-index: 42;
      left: 0; right: 0; bottom: 70px; transform: none;
      margin: 0 auto;
      width: min(220px, 78vw);
      font-size: 11px;
      padding: 6px 8px;
      border: 1px solid rgba(244, 246, 248, .85);
      background: rgba(8, 10, 12, .82);
      -webkit-user-select: text;
      user-select: text;
      cursor: text;
    }
    html.widget #typed::placeholder { color: rgba(244, 246, 248, .72); }
    html.widget .chip {
      background: #020805; border: 0; box-shadow: none !important; animation: none !important;
      top: auto; bottom: 104px; min-height: 0; min-width: 0;
      left: 0; right: 0;
      width: min(220px, 78vw); max-height: min(34vh, 220px);
      margin: 0 auto;
      padding: 6px 8px; border-radius: 8px;
      transform: none;
      overflow-x: hidden;
      overflow-y: auto;
      isolation: isolate;
      pointer-events: auto;
      cursor: default;
      -webkit-user-select: text;
      user-select: text;
    }
    html.widget .chip { text-align: left; font-size: 13px; line-height: 1.45; color: #f4f6f8; }
    html.widget .chip .line, html.widget #browserResults p { color: #f4f6f8; font: inherit; overflow-wrap: anywhere; }
    #resultHistory { margin-top: 8px; font-size: 12px; text-align: left; }
    #resultHistory summary { cursor: pointer; }
    html.widget body.speak .chip,
    html.widget body.think .chip,
    html.widget body.listen .chip {
      box-shadow: none !important;
      animation: none !important;
      filter: none !important;
    }
    html.widget .chip .line,
    html.widget .chip #browserResults {
      margin: 0;
      letter-spacing: 0; font-size: 12px; line-height: 1.45;
      max-height: none;
      overflow: visible;
      overflow-wrap: break-word;
      word-break: normal;
      text-shadow: none;
      -webkit-text-stroke: 0;
      pointer-events: auto;
    }
    html.widget #browserResults p { margin: 0 0 8px; }
    html.widget #browserResults p:last-child { margin-bottom: 0; }
    html.widget .chip #heard {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      overflow: hidden; overflow-wrap: anywhere;
      font-size: 10px; line-height: 1.2;
    }
    html.widget #orb3d {
      width: 240px; height: 240px; top: 40%; transform: translate(-50%, -50%);
      background: radial-gradient(circle at 50% 48%, rgba(2, 8, 5, .62) 0%, rgba(2, 8, 5, 0) 72%);
      border-radius: 50%;
      pointer-events: none !important;
    }
    html.widget #dock.sense,
    html.widget #dock {
      position: fixed;
      z-index: 40;
      top: auto;
      left: 50%;
      right: auto;
      bottom: 10px;
      transform: translateX(-50%);
      pointer-events: auto;
      width: auto;
      max-width: calc(100% - 12px);
      box-sizing: border-box;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      gap: clamp(3px, 2.1vw, 14px);
      overflow: visible;
      padding: 18px 2px 0;
    }
    html.widget #dock button {
      width: clamp(24px, 10.4vw, 44px); height: clamp(24px, 10.4vw, 44px);
      flex: 0 0 auto;
      border-radius: 50%; padding: 0;
      display: grid; place-items: center;
      background: rgba(8, 10, 12, .55); color: #f4f6f8;
      border: 1px solid rgba(244, 246, 248, .55);
      pointer-events: auto; z-index: 41;
    }
    html.widget .sense button.on { border-color: var(--amber); color: var(--amber); }
    html.widget .sense .ico {
      display: block; pointer-events: none;
      width: clamp(13px, 5.2vw, 22px); height: clamp(13px, 5.2vw, 22px);
    }
    html.widget .sense .btn-label { display: none; }
    html.widget #dock #stopBtn {
      width: clamp(24px, 10.4vw, 44px); height: clamp(24px, 10.4vw, 44px);
      min-width: 0; padding: 0; border-radius: 50%;
      border-color: var(--amber); color: var(--amber);
    }
    html.widget #dock #stopBtn .btn-label { display: none !important; }
    #hideBtn { min-width: 28px; }
    html.widget #dock #focusBtn { display: none !important; }
    html.widget #dock #hideBtn {
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      height: 14px;
      min-width: 0;
      padding: 0;
      border-radius: 3px;
      background: transparent;
      color: #e24b4b;
      border: 1px solid #e24b4b;
      z-index: 42;
    }
    html.widget #dock #hideBtn .ico {
      width: 10px;
      height: 10px;
      stroke-width: 2.4;
    }
    html.widget #dock.slim {
      padding-top: 0;
      width: auto;
      min-height: 16px;
    }
    html.widget #dock.slim #hideBtn {
      position: relative;
      top: auto;
      left: auto;
    }
    html.widget #dock.slim #eyesBtn,
    html.widget #dock.slim #watchBtn,
    html.widget #dock.slim #micBtn,
    html.widget #dock.slim #focusBtn,
    html.widget #dock.slim #stopBtn {
      display: none !important;
    }
    @media (min-width: 400px) {
      html.widget #dock #stopBtn {
        width: auto; min-width: clamp(36px, 11vw, 44px); height: auto;
        padding: 6px 8px 4px; border-radius: 12px; gap: 2px;
      }
      html.widget #dock #stopBtn .btn-label {
        display: block !important;
        font-size: 8px;
        letter-spacing: .14em;
      }
    }
    #dock.slim #eyesBtn, #dock.slim #watchBtn, #dock.slim #micBtn, #dock.slim #focusBtn { display: none; }
    #focusline {
      display: none; position: fixed; z-index: 8; top: 262px; left: 28px;
      font: 10px/1.6 "Share Tech Mono", ui-monospace, monospace; letter-spacing: 0.14em;
      color: var(--amber); text-shadow: 0 0 8px rgba(255, 179, 71, 0.35);
      pointer-events: none;
    }
    #focusline.on { display: block; }
    #reflexcard {
      display: none; position: fixed; z-index: 41; left: 6px; right: 6px; top: 6px;
      font: 10px/1.35 "Share Tech Mono", ui-monospace, monospace; color: #cfe; pointer-events: none;
      background: rgba(4, 12, 14, 0.9); border: 1px solid rgba(80, 220, 150, 0.35); border-radius: 6px; padding: 5px 7px;
    }
    #reflexcard .r { display: grid; grid-template-columns: 70px 1fr 28px 58px; gap: 5px; align-items: center; margin: 2px 0; }
    #reflexcard .k { color: #fff; } #reflexcard .q { color: #7a8; font-size: 8px; }
    #reflexcard .bar { position: relative; height: 4px; background: #233; border-radius: 2px; }
    #reflexcard .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #3ddc84; border-radius: 2px; }
    #reflexcard .bar b { position: absolute; top: -2px; width: 1px; height: 8px; background: #9ab; }
    #reflexcard .rxv { border: 1px solid #3a6; border-radius: 8px; text-align: center; font-size: 8px; color: #8fd; }
    #reflexcard .foot { color: #3ddc84; letter-spacing: 0.1em; margin-top: 3px; font-size: 9px; }
    #reflexcard.on { display: block; }
    #inboxcard {
      display: none; position: fixed; z-index: 42; right: 6px; left: 6px; bottom: 96px; pointer-events: auto;
      font: 10px/1.4 -apple-system, system-ui, sans-serif; color: #dde; background: rgba(10, 14, 22, 0.94);
      border: 1px solid rgba(120, 160, 255, 0.35); border-radius: 8px; padding: 6px 8px; max-height: 40vh; overflow: auto;
    }
    #inboxcard.on { display: block; }
    #inboxcard .h { font: 9px "Share Tech Mono", monospace; color: #8ab; letter-spacing: 0.12em; margin-bottom: 3px; }
    #inboxcard .t { font-weight: 700; color: #fff; } #inboxcard .f { color: #9cf; word-break: break-all; margin: 2px 0; } #inboxcard button { margin-top: 4px; font-size: 9px; }
    html.widget #focusline {
      top: auto; left: 50%; right: auto; bottom: 70px;
      transform: translateX(-50%); z-index: 40; text-align: center;
    }
    #dock.slim #stopBtn { display: grid; }
    @media (prefers-reduced-motion: reduce) {
      .orb, #board { animation: none !important; }
    }
    /* Ported from main: Face controls (Mic / Stop / Hide). */
    #driveBadge {
      position: fixed; z-index: 7; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 2, 2, .85); color: #ffb3b3; border: 1px solid rgba(255, 90, 90, .6);
      font: 11px "Share Tech Mono", ui-monospace, monospace; letter-spacing: .14em; padding: 6px 12px;
      animation: drivePulse 1.2s ease-in-out infinite;
    }
    @keyframes drivePulse { 50% { border-color: rgba(255, 90, 90, 1); } }
    #receipt { font: 10px "Share Tech Mono", ui-monospace, monospace; color: rgba(190, 255, 205, .55); letter-spacing: .08em; margin-top: 6px; min-height: 12px; }
    #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    #chips button { background: rgba(2, 10, 6, .7); color: var(--mint, #3dff6a); border: 1px solid rgba(61, 255, 106, .35);
      font: 10px "Share Tech Mono", ui-monospace, monospace; letter-spacing: .1em; padding: 4px 8px; cursor: pointer; }
    .controls {
      position: fixed; z-index: 6; left: 28px; bottom: 48px;
      display: flex; gap: 8px; pointer-events: auto;
    }
    .controls button {
      background: rgba(2, 10, 6, .8); color: var(--mint, #3dff6a);
      border: 1px solid rgba(61, 255, 106, .45);
      font: 11px "Share Tech Mono", ui-monospace, monospace;
      letter-spacing: .16em; padding: 6px 10px; cursor: pointer;
    }
    body.presentation-hidden #board,
    body.presentation-hidden .hud,
    body.presentation-hidden .chip,
    body.presentation-hidden #typed { visibility: hidden; }
    body.presentation-hidden .controls { visibility: visible; }
  </style>
</head>
<body class="idle">
  <canvas id="board" aria-hidden="true"></canvas>
  <div id="graph" aria-hidden="true"></div>
  <div class="hud tl">
    <div class="name" id="hudName">J.A.R.V.I.S.</div>
    <div class="sub" id="link">NEURAL LINK - CHECKING WIRES</div>
    <div class="sub" id="mode">MODE - CHECKING</div>
    <div class="sub" id="voice">VOICE - CHECKING</div>
    <div class="sub" id="graphline">GRAPH - LOADING</div>
    <div class="dots">
      <span id="dotOnline" title="face /healthz"><i></i>ONLINE</span>
      <span id="dotLive" title="mic armed or bus listen"><i></i>LIVE</span>
      <span id="dotConnected" title="talk wire up"><i></i>CONNECTED</span>
    </div>
    <video id="eyesPreview" muted playsinline></video>
  </div>
  <div class="sense" id="dock">
    <button type="button" id="eyesBtn" aria-label="Eyes">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="btn-label">EYES</span>
    </button>
    <button type="button" id="watchBtn" aria-label="Desktop">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.4"/><path d="M8 20h8M12 16v4"/></svg>
      <span class="btn-label">WATCH</span>
    </button>
    <button type="button" id="focusBtn" aria-label="Focus session">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/><path d="M12 4V2M12 22v-2M4 12H2M22 12h-2"/></svg>
      <span class="btn-label">FOCUS</span>
    </button>
    <button type="button" id="micBtn" aria-label="Microphone" aria-pressed="false">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8"/></svg>
      <span class="btn-label">MIC</span>
    </button>
    <button type="button" id="stopBtn" aria-label="Stop talking">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.4"/></svg>
      <span class="btn-label">STOP</span>
    </button>
    <button type="button" id="hideBtn" aria-label="Hide icons" aria-pressed="false">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      <span class="btn-label">HIDE</span>
    </button>
  </div>
  <div id="focusline" role="status"></div>
  <div id="reflexcard" role="status" aria-label="reflex decisions"></div>
  <div id="inboxcard" role="status" aria-label="jarvis inbox"></div>
  <div class="hud tr">
    <div>
      <div class="phase" id="phase">IDLE</div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
    <div class="orb" aria-hidden="true"></div>
  </div>
  <div class="hud bl" id="micline">MIC - TAP TO ARM</div>
  <div class="hud br" id="hint">TAP BOARD OR SPACE TO TALK</div>
  <canvas id="orb3d" aria-hidden="true"></canvas>
  <div class="chip" id="chip" role="status">
    <canvas id="wave" width="640" height="46"></canvas>
    <div class="mark" id="mark">J.A.R.V.I.S.</div>
    <div class="line" id="heard" style="opacity:.6;font-size:.8em"></div>
    <div class="line" id="spoken"></div>
      <div id="chips" aria-label="suggestions"></div>
      <div id="receipt" aria-label="tool receipt"></div>
      <details id="resultHistory" hidden><summary>Earlier updates</summary><div id="conversationHistory"></div><div id="browserResults"></div></details>
  </div>
  <div id="driveBadge" role="status" hidden>JARVIS IS DRIVING · touch the mouse or keyboard to take over</div>
  <div class="controls" id="controls">
    <button type="button" id="mic">Mic</button>
    <button type="button" id="stop">Stop</button>
    <button type="button" id="hide">Hide</button>
  </div>
  <input id="typed" placeholder="/ type fallback · enter to send" autocomplete="off" />
  <script src="/vendor/3d-force-graph.min.js"></script>
  <script src="/orb.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const synth = window.speechSynthesis;
    const YES_RE = /^(yes|yeah|yep|do it|approve|ok|okay)\s*[.!]?\s*$/i;
    const STOP_RE = /^(?:hey\s+)?(?:jarvis[,.]?\s*)?(stop|cancel|never mind|forget it|shut up)\s*[.!?]?\s*$/i;
    const WAKE_RE = /^(?:hey\s+)?jarvis[,.]?\s*/i;
    const RESTART_MIN = 400;
    const RESTART_MAX = 800;
    const TTS_COOLDOWN = 700;
    const PLAY_SPEED = 1.1;
    const WIDGET = location.pathname === "/widget" || /(?:\?|&)widget=1(?:&|$)/.test(location.search);
    if (WIDGET) {
      document.documentElement.classList.add("widget");
      document.body.classList.add("widget");
      const typedBoot = $("typed");
      if (typedBoot) {
        typedBoot.classList.add("on");
        typedBoot.setAttribute("aria-label", "Type to Jarvis");
        typedBoot.placeholder = "type · enter";
      }
    }
    const state = {
      phase: "idle", rec: null, stream: null, live: true, armed: false, arming: false,
      listening: false, starting: false, turning: false, pending: null, greeted: false,
      recGen: 0, restartTimer: 0, lastStartAt: 0, turnStartedAt: 0, failStreak: 0,
      stack: { name: "J.A.R.V.I.S.", operator: "Evens" },
    };

          if (turnGen !== gen) return;
          if (typeof out.turn_gen === "number" && out.turn_gen > 0) busGen = out.turn_gen;
          else if (typeof out.gen === "number" && out.gen > 0) busGen = out.gen;
          const lineText = productLine(out.spoken);
          if (lineText) lastSpoken = lineText;
          $("spoken").className = "line" + (out.ask ? " ask" : "");
          if (out.ask) state.pending = utterance;
          else state.pending = null;
          nextHandle = Array.isArray(out.cites) && out.cites.length && !out.ask
            ? 'ASK "WHY" — I WILL UNPACK IT'
            : "";
          spokenLock = lineText;
          state.renderedBusGen = busGen;
          $("spoken").textContent = lineText;
          if (voice) enqueueSpeak(lineText);
          if (out.operator_task) evNote(out.operator_task, out.speech_seq);
        }
      } catch (e) {
        if (turnGen === gen) {
          if (e && e.name === "AbortError") {
            $("spoken").textContent = "Stopped. Standing by.";
          } else {
            let dark = false;
            try {
              const health = await fetch("/healthz", { cache: "no-store" });
              dark = !health.ok;
            } catch (err) {
              dark = true;
            }
            $("spoken").textContent = dark
              ? "Face is dark on 127.0.0.1:4018. Start the Face, then type again."
              : "Turn failed. Type and enter, or tap the board.";
          }
        }
      } finally {
        if (turnGen === gen) {
          if (turnAbort === ac) turnAbort = null;
          state.turning = false;
          if (state.phase === "think" && !ttsSpeaking()) {
            paintPhase(state.armed ? "listen" : "idle");
          }
          if (state.armed && state.live && !state.listening && !ttsSpeaking()) scheduleRestart(TTS_COOLDOWN);
        }
      }
    }

    function isMouthEcho(said) {
      const text = (said || "").trim();
      if (!text) return false;
      if (STOP_RE.test(text)) return false;
      if (ttsSpeaking() || state.turning) return true;
      if (Date.now() - lastTtsBusyAt < ECHO_TAIL_MS) return true;
      if (soundsLikeJarvis(text)) return true;
      if (ECHO_RE.test(text)) return true;
      if (lastSpoken && text.length > 20 && lastSpoken.toLowerCase().indexOf(text.toLowerCase().slice(0, 40)) >= 0) return true;
      return false;
    }
    function handleHeard(raw) {
      let said = (raw || "").trim();
      if (!said) return;
      if (isMouthEcho(said)) return;
      const woke = WAKE_RE.test(said);
      said = said.replace(WAKE_RE, "").trim() || (woke ? "" : said);
      if (!said) { greet(); return; }
      if (state.pending && YES_RE.test(said)) turn(state.pending, true, true);
      else turn(said, false, true);
    }

    // FINISH_MS: a pause mid-sentence is not the end of the thought.
    // Buffer final results; interjections (stop / wait) bypass instantly.
    const FINISH_MS = 1400;  // Evens 10-16 "Jarvis should not interrupt me when I'm talking"
    let finishTimer = 0;
    let pendingHeard = "";
    function clearHeardBuffer() {
      clearTimeout(finishTimer);
      finishTimer = 0;
      pendingHeard = "";
    }
    function queueHeard(t) {
      const bit = (t || "").trim();
      if (!bit) return;
      pendingHeard = pendingHeard ? `${pendingHeard} ${bit}` : bit;
      clearTimeout(finishTimer);
      finishTimer = setTimeout(() => {
        const said = pendingHeard;
        pendingHeard = "";
        finishTimer = 0;
        if (said) handleHeard(said);
      }, midSentence(pendingHeard) ? FINISH_MS + MID_SENTENCE_EXTRA_MS : FINISH_MS);
    }
    function holdFinish() {
      clearTimeout(finishTimer);
      finishTimer = setTimeout(() => {
        const said = pendingHeard;
        pendingHeard = "";
        finishTimer = 0;
        if (said) handleHeard(said);
      }, midSentence(pendingHeard) ? FINISH_MS + MID_SENTENCE_EXTRA_MS : FINISH_MS);
    }
    // Z12 reflex 'finished talking': a trailing and/so/um/comma means he is mid-sentence; wait one more beat.
    const MID_SENTENCE_EXTRA_MS = 1100;
    const MID_RE = /(?:\b(?:and|so|but|or|because|then|um+|uh+|er+|like|with|to|the|a|my|of)|,|\.\.\.|-)\s*$/i;
    function midSentence(t) { return MID_RE.test(String(t || "").trim()); }

    function scheduleRestart(ms) {
      clearTimeout(state.restartTimer);
      if (!state.live || !state.armed) return;
      if (ttsSpeaking()) return;
      const wait = Math.max(RESTART_MIN, Math.min(RESTART_MAX, ms || RESTART_MIN));
      state.restartTimer = setTimeout(() => {
        if (ttsSpeaking()) return;
        if (state.live && state.armed && !state.listening && !state.starting && !state.rec) startListen();
      }, wait);
    }

    function showTypeFallback(line) {
      $("typed").classList.add("on");
      $("hint").textContent = "TYPE AND ENTER · OR TAP THE BOARD";
      const now = ($("spoken").textContent || "").trim();
      if (!now || isStatusLine(now) || isFallbackLine(now) || /^listening\.?$/i.test(now)) {
        $("spoken").textContent = line;
      }
    }

    async function holdMic() {
      if (streamLive()) return true;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        const err = new Error("no-media");
        err.name = "NotFoundError";
        throw err;
      }
      state.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      try {  // barge-in needs the speaker bleed cancelled; ask for it on the live track
        for (const t of state.stream.getAudioTracks()) await t.applyConstraints({ echoCancellation: true, noiseSuppression: true });
      } catch (e) {}
      startBargeWatch();
      return streamLive();
    }

    // Z03 barge-in: while Jarvis speaks and the mic is live, sustained voice on the mic (louder than the
    // echo-cancelled TTS bleed) cuts the speech off and hands the floor back. Mic level only; no audio leaves.
    // Evens 10-16 "I should be able to interrupt it": the old rule compared the echo-cancelled mic with the RAW TTS
    // output level, which is always louder, so it almost never fired. Now: mic vs the bleed the mic itself hears
    // while Jarvis talks (median of the last ~2 s of mic levels during speech).
    const BARGE = { floor: 0.03, ratio: 2.2, holdMs: 260, tick: 60, bleedWindow: 33 };
    let bargeTimer = null, bargeSince = 0, micAnalyser = null, micBuf = null;
    function micLevel(an, buf) {
      an.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      return Math.sqrt(sum / buf.length);
    }
    function bargeHit(mic, bleed, heldMs) {
      return mic > BARGE.floor && mic > bleed * BARGE.ratio && heldMs >= BARGE.holdMs;
    }
    function median(xs) { const a = xs.slice().sort((p, q) => p - q); return a.length ? a[a.length >> 1] : 0; }
    window.__jarvisBarge = { BARGE, bargeHit };
    function startBargeWatch() {
      if (bargeTimer || !streamLive()) return;
      try {
        unlockAudio();
        if (!audioCtx) return;
        micAnalyser = audioCtx.createAnalyser();
        micAnalyser.fftSize = 1024;
        micBuf = new Float32Array(micAnalyser.fftSize);
        audioCtx.createMediaStreamSource(state.stream).connect(micAnalyser);
      } catch (e) { micAnalyser = null; return; }
      let levels = [];
      bargeTimer = setInterval(() => {
        if (!micAnalyser || !state.armed || !ttsSpeaking()) { bargeSince = 0; levels = []; return; }
        const mic = micLevel(micAnalyser, micBuf);
        const bleed = levels.length >= 8 ? median(levels) : mic;  // first ~0.5 s of speech: learn the bleed
        levels.push(mic);
        if (levels.length > BARGE.bleedWindow) levels.shift();
        const now = Date.now();
        if (levels.length >= 8 && mic > BARGE.floor && mic > bleed * BARGE.ratio) {
          if (!bargeSince) bargeSince = now;
          if (bargeHit(mic, bleed, now - bargeSince)) {
            bargeSince = 0; levels = [];
            pressStop();
            $("spoken").textContent = "Go ahead, I'm listening.";
            scheduleRestart(RESTART_MIN);  // listen at once so his first words are not lost
          }
        } else {
          bargeSince = 0;
        }
      }, BARGE.tick);
    }

    function startListen() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        showTypeFallback("Speech recognition unsupported here. Type instead.");
        return;
      }
      if (!state.live || !state.armed) return;
      if (ttsSpeaking()) return;
      if (state.listening || state.starting || state.rec) return;
      state.recGen += 1;
      const gen = state.recGen;
      const rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      rec.maxAlternatives = 1;
      rec.onstart = () => {
        if (gen !== state.recGen) return;
        state.starting = false;
        state.listening = true;
        state.failStreak = 0;
        state.lastStartAt = Date.now();
        if (!state.turning && !ttsSpeaking()) paintPhase("listen");
      };
      rec.onspeechstart = () => {
        if (ttsSpeaking()) return;
        if (!state.turning) paintPhase("listen");
      };
      rec.onresult = (e) => {
        const last = e.results[e.results.length - 1];
        const t = last[0].transcript;
        if (last.isFinal && STOP_RE.test((t || "").trim())) {
          clearHeardBuffer();
          handleHeard(t);
          return;
        }
        if (ttsSpeaking() || state.turning) return;
        $("spoken").textContent = pendingHeard ? `${pendingHeard} ${t}` : t;
        if (last.isFinal) queueHeard(t);
        else if (finishTimer && (t || "").trim()) holdFinish();  // he is still talking: the pause clock restarts
      };
      rec.onerror = (e) => {
        const err = (e && e.error) || "";
        if (err === "not-allowed" || err === "service-not-allowed") {
          state.armed = false;
          state.listening = false;
          state.starting = false;
          showTypeFallback(streamLive()
            ? "Speech recognition blocked. Type instead."
            : "Allow the microphone, then tap the board.");
          paintPhase("idle");
          return;
        }
        if (err === "network") {
          showTypeFallback("Speech needs network. Type is a fallback.");
          return;
        }
        if (err === "aborted") state.failStreak += 1;
      };
      rec.onend = () => {
        if (gen !== state.recGen) return;
        const lived = Date.now() - (state.lastStartAt || Date.now());
        state.listening = false;
        state.starting = false;
        state.rec = null;
        if (!state.live || !state.armed) return;
        if (ttsSpeaking()) return;
        if (lived < RESTART_MIN) state.failStreak += 1;
        else state.failStreak = Math.max(0, state.failStreak - 1);
        const backoff = Math.min(RESTART_MAX, RESTART_MIN + state.failStreak * 150);
        scheduleRestart(backoff);
      };
      state.rec = rec;
      state.starting = true;
      state.lastStartAt = Date.now();
      try {
        rec.start();
      } catch (e) {
        state.starting = false;
        state.rec = null;
        if (e && /already started/i.test(String(e.message || e))) return;
        scheduleRestart(RESTART_MAX);
      }
    }

    function disarmMic() {
      state.armed = false;
      state.live = false;
      state.arming = false;
      stopListen();
      if (state.stream) {
        for (const track of state.stream.getTracks()) track.stop();
        state.stream = null;
      }
      try { api("/api/listen", { live: false }); } catch (e) {}
      paintPhase("idle");
    }
    async function toggleMic() {
      if (state.listening) {
        disarmMic();
        return;
      }
      await armMic();
    }
    async function armMic() {
      unlockAudio();
      if (state.arming) return;
      if (!hasSR()) {
        showTypeFallback("Speech recognition unsupported here. Type instead.");
        return;
      }
      state.armed = true;
      state.live = true;
      startListen();
      if (state.armed && streamLive() && (state.listening || state.starting || state.rec)) {
        paintPhase("listen");
        return;
      }
      state.arming = true;
      try {
        await holdMic();
      } catch (e) {
        state.arming = false;
        state.armed = false;
        state.live = false;
        showTypeFallback("Allow the microphone, then tap the board.");
        paintPhase("idle");
        return;
      }
      state.arming = false;
      if (!state.listening && !state.starting && !state.rec) startListen();
      if (!(state.listening || state.starting || state.rec)) {
        paintPhase("idle");
        return;
      }
      try { await api("/api/listen", { live: true }); } catch (e) {}
      paintPhase("listen");
    }

    // --- living circuit board (original MIT; pixels from FiOTrxq9ckM stills) ---
    const canvas = $("board");
    const ctx = canvas.getContext("2d");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const traces = [];
    const nodes = [];
    const pulses = [];

    function layout() {
      const dpr = devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      traces.length = 0;
      nodes.length = 0;
      pulses.length = 0;
      const cols = 18, rows = 11;
      const gw = canvas.width / cols, gh = canvas.height / rows;
      for (let y = 1; y < rows; y++) {
        for (let x = 1; x < cols; x++) {
          if (Math.random() < 0.22) continue;
          const x0 = x * gw + (Math.random() - 0.5) * gw * 0.15;
          const y0 = y * gh + (Math.random() - 0.5) * gh * 0.15;
          const horiz = Math.random() > 0.45;
          const x1 = horiz ? x0 + gw * (0.7 + Math.random() * 1.4) * (Math.random() > 0.5 ? 1 : -1) : x0;
          const y1 = horiz ? y0 : y0 + gh * (0.7 + Math.random() * 1.4) * (Math.random() > 0.5 ? 1 : -1);
          traces.push({ x0, y0, x1, y1, w: 0.8 + Math.random() * 1.6 });
          if (Math.random() < 0.35) nodes.push({ x: x0, y: y0, s: 4 + Math.random() * 14, kind: Math.random() < 0.3 ? "chip" : "pad" });
        }
      }
      for (let i = 0; i < 28; i++) {
        const tr = traces[i % traces.length];
        pulses.push({ tr, t: Math.random(), speed: 0.002 + Math.random() * 0.006 });
      }
    }

    function pal() {
      if (state.phase === "listen") return [125, 206, 160];
      if (state.phase === "think") return [224, 162, 74];
      return [61, 255, 106];
    }

    function drawBoard() {
      if (!ctx) return;
      const w = canvas.width, h = canvas.height;
      const [r, g, b] = pal();
      ctx.fillStyle = "#020805";
      ctx.fillRect(0, 0, w, h);
      const grd = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w * 0.55);
      grd.addColorStop(0, "rgba(20, 80, 40, .35)");
      grd.addColorStop(1, "rgba(2, 8, 5, 0)");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);
      ctx.lineCap = "square";
      traces.forEach((tr) => {
        ctx.strokeStyle = `rgba(${r},${g},${b},0.18)`;
        ctx.lineWidth = tr.w * (devicePixelRatio || 1);
        ctx.beginPath();
        ctx.moveTo(tr.x0, tr.y0);
        ctx.lineTo(tr.x1, tr.y1);
        ctx.stroke();
      });
      nodes.forEach((n) => {
        ctx.fillStyle = `rgba(${r},${g},${b},${n.kind === "chip" ? 0.16 : 0.28})`;
        ctx.strokeStyle = `rgba(${r},${g},${b},0.45)`;
        ctx.lineWidth = 1;
        const s = n.s * (devicePixelRatio || 1);
        ctx.beginPath();
        ctx.rect(n.x - s / 2, n.y - s / 2, s, n.kind === "chip" ? s * 0.55 : s);
        ctx.fill();
        ctx.stroke();
      });
      const dir = state.phase === "listen" ? -1 : 1;
      const boost = state.phase === "idle" ? 1 : 2.1;
      pulses.forEach((p) => {
        if (!reduce) p.t = (p.t + p.speed * boost * dir + 1) % 1;
        const x = p.tr.x0 + (p.tr.x1 - p.tr.x0) * p.t;
        const y = p.tr.y0 + (p.tr.y1 - p.tr.y0) * p.t;
        ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
        ctx.beginPath();
        ctx.arc(x, y, 2.2 * (devicePixelRatio || 1), 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawBoard);
    }

    const wave = $("wave");
    const wctx = wave.getContext("2d");
    function isStatusLine(text) {
      const line = String(text || "").trim();
      if (!line) return true;
      return /^(sir\.\s*)?(calling the model|calling cursor|thinking|looking)\.?$/i.test(line);
    }
    function isFallbackLine(text) {
      return /speech (needs network|recognition)|type is a fallback|type instead|allow the microphone/i.test(
        String(text || "")
      );
    }
    function productLine(text) {
      const line = String(text || "").replace(/\*\*/g, "").trim();
      if (!line || isStatusLine(line)) return "";
      return line;
    }
    function drawWave(t) {
      if (!wctx) return;
      wctx.clearRect(0, 0, wave.width, wave.height);
      const [r, g, b] = pal();
      wctx.strokeStyle = "rgb(" + r + "," + g + "," + b + ")";
      wctx.lineWidth = 2;
      wctx.beginPath();
      for (let x = 0; x < wave.width; x++) {
        const y = 23 + Math.sin(x * 0.08 + t / 90) * 12 * (0.4 + Math.random() * 0.6);
        if (x === 0) wctx.moveTo(x, y);
        else wctx.lineTo(x, y);
      }
      wctx.stroke();
      requestAnimationFrame(drawWave);
    }

    const SCRAMBLE = "/#R0?BU&CN1A%X7*Q";
    function paintChip() {
      if (WIDGET) return;
      if (state.phase === "think") {
        $("mark").textContent = Array.from({ length: 12 }, () => SCRAMBLE[Math.floor(Math.random() * SCRAMBLE.length)]).join(" ");
      } else if (state.listening || state.phase === "listen") {
        $("mark").textContent = "LISTENING";
      } else {
        $("mark").textContent = dotted(state.stack.face || "JARVIS");
      }
    }

    let lastHud = { health: null, bus: null, wires: null };
    function setDot(id, on) {
      const el = $(id);
      if (!el) return;
      el.classList.toggle("on", !!on);
      el.classList.toggle("off", !on);
    }
    function paintLights(parts) {
      lastHud = { ...lastHud, ...(parts || {}) };
      const health = lastHud.health;
      const bus = lastHud.bus;
      const report = lastHud.wires || {};
      const wires = report.wires || {};
      const talk = String(report.talk || "");
      // ONLINE = this face /healthz answered ok
      setDot("dotOnline", !!(health && health.ok && health.online !== false));
      // LIVE = this pane armed the mic, or /api/bus listen is written
      setDot("dotLive", !!(state.armed || (bus && (bus.mic === "live" || bus.phase === "listen"))));
      // CONNECTED = a talk wire is actually up
      setDot("dotConnected", talk === "openrouter" || talk === "xai" || talk === "grokbot" || wires.openrouter === "talk" || wires.grok === "talk" || wires.grokbot === "live");
    }
    function paintWires(report) {
      const wires = (report && report.wires) || {};
      const talk = String((report && report.talk) || "");
      const model = String((report && report.talk_model) || "").trim();
      let mouth = "DARK";
      if (talk === "openrouter" || wires.openrouter === "talk") mouth = "OPENROUTER";
      else if (talk === "xai" || wires.grok === "talk") mouth = "XAI";
      else if (talk === "grokbot" || wires.grokbot === "live") mouth = "GROKBOT";
      $("link").textContent = "NEURAL LINK - " + mouth + (model && mouth !== "DARK" ? " · " + model : "");
    }
    function paintMode(bus, report) {
      if (!$("mode")) return;
      const harness = String((bus && bus.harness_mode) || "").trim();
      const mode = String((report && report.mode) || "").trim();
      const shown = (mode === "harness" && harness) ? harness : (mode || harness || "unset");
      $("mode").textContent = "MODE - " + shown.toUpperCase();
    }
    function paintVoice(report) {
      if (!$("voice")) return;
      const engine = String((report && (report.speak_engine || report.engine)) || "dark");
      voiceEngine = engine;
      const voiceId = String((report && (report.speak_voice_id || report.voice)) || "dark");
      const speakModel = String((report && report.speak_model) || "");
      const reason = String((report && report.fallback_reason) || "").trim();
      let line = "VOICE - " + engine.toUpperCase() + " · " + voiceId;
      if (engine === "elevenlabs" && speakModel) line += " · " + speakModel;
      else if (engine !== "elevenlabs" && reason) line += " · " + reason;
      $("voice").textContent = line;
    }
    function paintGraphLine(data) {
      const line = $("graphline");
      if (!line) return;
      if (!data || data.ok === false) {
        line.textContent = "GRAPH - DARK";
        return;
      }
      const n = Number(data.nodeCount != null ? data.nodeCount : ((data.nodes || []).length)) || 0;
      const e = Number(data.linkCount != null ? data.linkCount : ((data.links || []).length)) || 0;
      line.textContent = "GRAPH - " + n + " NODES · " + e + " EDGES";
    }

    let eyesStream = null;
    async function mountVaultGraph() {
      const host = $("graph");
      let data = { nodes: [], links: [], nodeCount: 0, linkCount: 0 };
      try { data = await api("/api/graph"); } catch (e) {
        paintGraphLine(null);
        return;
      }
      paintGraphLine(data);
      if (!host || typeof ForceGraph3D !== "function") return;
      if (!data || !data.nodes || !data.nodes.length) return;
      document.body.classList.add("has-graph");
      // ?nographblock=1 is a connection-probe query, not a sim freeze.
      vaultGraph = ForceGraph3D({ controlType: "orbit" })(host)
        .backgroundColor("#020805")
        .showNavInfo(false)
        .graphData({ nodes: data.nodes, links: data.links })
        .nodeLabel((n) => n.name || n.id)
        .nodeColor((n) => n.color || "#3dff6a")
        .nodeRelSize(4)
        .linkColor(() => "rgba(61,255,106,0.28)")
        .linkOpacity(0.35)
        .enablePointerInteraction(true)
        .enableNavigationControls(true)
        .warmupTicks(0)
        .cooldownTicks(Infinity)
        .cooldownTime(Infinity)
        .d3AlphaDecay(0.006)
        .d3VelocityDecay(0.28)
        .onNodeClick((n) => {
          if ($("spoken") && n && n.name) $("spoken").textContent = n.name;
        });
      const ctrls = vaultGraph.controls && vaultGraph.controls();
      if (ctrls) {
        ctrls.autoRotate = true;
        ctrls.autoRotateSpeed = 0.4;
      }
      if (typeof vaultGraph.resumeAnimation === "function") vaultGraph.resumeAnimation();
      const fit = () => {
        if (!vaultGraph) return;
        vaultGraph.width(host.clientWidth || innerWidth).height(host.clientHeight || innerHeight);
      };
      fit();
      window.addEventListener("resize", fit);
    }
    async function snapEyes() {
      const video = $("eyesPreview");
      if (!video || !video.videoWidth) return "";
      const c = document.createElement("canvas");
      const w = Math.min(640, video.videoWidth || 320);
      const h = Math.round(w * ((video.videoHeight || 240) / (video.videoWidth || 320)));
      c.width = w;
      c.height = h;
      const cx = c.getContext("2d");
      if (!cx) return "";
      cx.drawImage(video, 0, 0, w, h);
      return c.toDataURL("image/jpeg", 0.72);
    }
    // Eyes booleans: frames stay in the browser; only present/absent rides the bus.
    let eyesPresenceTimer = 0;
    let eyesPrevLuma = null;

    function onArmGesture(e) {
      if (WIDGET) return;
      if (e && e.target === $("typed")) return;
      if (e && e.target && e.target.closest && e.target.closest(".sense")) return;
      if (e && e.target && (e.target.id === "graph" || (e.target.closest && e.target.closest("#graph")))) return;
      if (e && e.preventDefault) e.preventDefault();
      armMic();
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target !== $("typed")) {
        e.preventDefault();
        armMic();
      }
      if (e.key === "/") {
        e.preventDefault();
        $("typed").classList.add("on");
        $("typed").focus();
      }
      if (e.key === "Escape" && !WIDGET) $("typed").classList.remove("on");
    });
    $("typed").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        // BUS300-P0-002: typed = text only (voice=false); mic path alone may speak.
        turn($("typed").value.trim(), false, false);
        $("typed").value = "";
      }
    });
    if (WIDGET) {
      document.addEventListener("pointerdown", unlockAudio, true);
    }
    $("chip").addEventListener("click", onArmGesture);
    $("board").addEventListener("click", onArmGesture);
    $("mic").addEventListener("click", (e) => { e.stopPropagation(); e.preventDefault(); pressMic(); });
    $("stop").addEventListener("click", (e) => { e.stopPropagation(); e.preventDefault(); turn("stop", false, false); });
    $("hide").addEventListener("click", (e) => { e.stopPropagation(); e.preventDefault(); hidePresentation(); });
    if ($("eyesBtn")) $("eyesBtn").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleEyes(); });
    if ($("watchBtn")) $("watchBtn").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); clickWatch(); });
    if ($("focusBtn")) $("focusBtn").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); clickFocus(); });
    if ($("stopBtn")) $("stopBtn").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      turn("stop", false, false);
    });
    if ($("hideBtn")) $("hideBtn").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleChrome(); });
    if ($("micBtn")) {
      $("micBtn").addEventListener("pointerdown", (e) => { e.stopPropagation(); }, true);
      $("micBtn").addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        toggleMic();
      }, true);
    }

    (async () => {
      try {
        const stack = await api("/api/stack");
        state.stack = { ...state.stack, ...stack, face: "JARVIS" };
        $("hudName").textContent = dotted("JARVIS");
        $("mark").textContent = dotted("JARVIS");
      } catch (e) {}
      layout();
      window.addEventListener("resize", layout);
      if (WIDGET) mountOrb();
      if (!WIDGET) mountVaultGraph();
      if (!reduce && !WIDGET) {
        requestAnimationFrame(drawBoard);
        requestAnimationFrame(drawWave);
      }
      tickClock();
      setInterval(tickClock, 1000);
      setInterval(paintChip, 90);
      refresh();
      setInterval(refresh, 800);
      document.addEventListener("visibilitychange", () => {
        if (pageVisible()) {
          if (vaultGraph && typeof vaultGraph.resumeAnimation === "function") vaultGraph.resumeAnimation();
        } else if (!WIDGET) {
          retireHidden();
        }
      });
      window.addEventListener("pagehide", pageExit);
      window.addEventListener("beforeunload", pageExit);
      if (!hasSR()) {
        showTypeFallback("Speech recognition unsupported here. Type instead.");
        return;
      }
      let granted = false;
      try {
        const perm = await navigator.permissions.query({ name: "microphone" });
        granted = perm.state === "granted";
      } catch (e) {}
      if (granted && !WIDGET) armMic();
      else {
        paintPhase("idle");
        $("hint").textContent = "TAP BOARD OR SPACE TO TALK";
      }
      window.jarvisArmMic = armMic;
    })();
  </script>
</body>
</html>
