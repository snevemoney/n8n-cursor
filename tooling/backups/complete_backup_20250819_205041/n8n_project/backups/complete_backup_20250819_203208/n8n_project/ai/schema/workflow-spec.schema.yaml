type: object
required: [name, trigger, steps]
properties:
  name: 
    type: string
    description: Human-readable workflow name
  active: 
    type: boolean
    default: false
    description: Whether the workflow should be active when imported
  trigger:
    type: object
    required: [type]
    properties:
      type: 
        enum: [webhook, cron]
        description: Type of trigger
      id:
        type: string
        pattern: "^[a-zA-Z0-9_]+$"
        description: Optional ID for referencing in connections
      name:
        type: string
        description: Human-readable trigger name
      path: 
        type: string
        description: Webhook path (for webhook triggers)
      method: 
        enum: [GET, POST, PUT, DELETE]
        default: POST
        description: HTTP method (for webhook triggers)
      schedule: 
        type: string
        description: Schedule expression (for cron triggers)
  steps:
    type: array
    items:
      type: object
      required: [id, type]
      properties:
        id: 
          type: string
          pattern: "^[a-zA-Z0-9_]+$"
          description: Unique step identifier
        type: 
          enum: [httpRequest, set, function, if, merge]
          description: Step type
        name: 
          type: string
          description: Human-readable step name
        request:
          type: object
          description: HTTP request configuration (for httpRequest steps)
          properties:
            method: 
              type: string
              default: GET
            url: 
              type: string
            headers: 
              type: object
              additionalProperties: true
            query: 
              type: object
              additionalProperties: true
            json: 
              description: JSON body for POST/PUT requests
        fields: 
          type: object
          additionalProperties: true
          description: Fields to set (for set steps)
        code: 
          type: string
          description: JavaScript code (for function steps)
        condition: 
          type: string
          description: JavaScript expression (for if steps)
  connections:
    type: array
    description: Explicit connections between steps
    items:
      type: object
      required: [from, to]
      properties:
        from: 
          type: string
          description: Source step ID (can include .true/.false for if steps)
        to: 
          type: string
          description: Target step ID
