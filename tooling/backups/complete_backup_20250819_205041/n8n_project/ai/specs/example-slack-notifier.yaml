name: Simple Slack Notifier
active: false
trigger:
  type: webhook
  path: /slack-notify
  method: POST
steps:
  - id: extract_message
    type: set
    name: Extract Message Data
    fields:
      message: "{{$json.message || 'Default notification'}}"
      channel: "{{$json.channel || '#general'}}"
      username: "{{$json.username || 'n8n-bot'}}"
  
  - id: validate_message
    type: if
    name: Check Message Exists
    condition: "{{$json.message && $json.message.length > 0}}"
  
  - id: send_to_slack
    type: httpRequest
    name: Send Slack Message
    request:
      method: POST
      url: "https://hooks.slack.com/services/{{secrets.SLACK_WEBHOOK_URL}}"
      json:
        text: "{{$json.message}}"
        channel: "{{$json.channel}}"
        username: "{{$json.username}}"
        icon_emoji: ":robot_face:"

connections:
  - from: extract_message
    to: validate_message
  - from: validate_message.true
    to: send_to_slack
